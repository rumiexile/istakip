    reportPhoto(id) { return S.photos['r' + id] || ''; },
    async api(action, body, query) {
      await new Promise((r) => setTimeout(r, 120 + Math.random() * 160));
      const fn = A[action];
      if (!fn) throw new Error('Bu işlem demoda kullanılamıyor.');
      let b = body || {};
      if (body instanceof FormData) { b = {}; body.forEach((v, k) => { b[k] = v; }); }
      const r = await fn(b, query || {});
      return r === undefined ? null : JSON.parse(JSON.stringify(r));
    },
    photo(c) { return S.photos[c.id] || ''; },
  };
})();

    fit();
    const colors = ['#fde047', '#f59e0b', '#f472b6', '#818cf8', '#22d3ee', '#34d399', '#fb7185', '#ffffff'];
    const rockets = [], sparks = [];

    const launch = () => {
      const x = innerWidth * (0.15 + Math.random() * 0.7);

      const n = 48 + ((Math.random() * 30) | 0), c2 = colors[(Math.random() * colors.length) | 0];

    return o;
  };

  /* ---------- sıklık editörü ---------- */
  App.freqFields = (v, prefix) => {
    v = v || {}; prefix = prefix || 'f' + Math.random().toString(36).slice(2, 7);
    const t = v.freq_type || 'daily';
    const wd = String(v.weekdays || '').split(',');
    const r = (val, lbl) => `<label><input type="radio" name="${prefix}_type" value="${val}" ${t === val ? 'checked' : ''}><span>${lbl}</span></label>`;
    const days = [1, 2, 3, 4, 5, 6, 7].map((d) => `<label><input type="checkbox" name="${prefix}_wd" value="${d}" ${wd.includes(String(d)) ? 'checked' : ''}><span>${App.DAY_SHORT[d]}</span></label>`).join('');
    return `<div class="freq" data-freq="${prefix}">
      <div class="seg">${r('daily', 'Her gün')}${r('every_n_days', 'X günde 1')}${r('weekly', 'Haftalık')}${r('monthly', 'Aylık')}${r('on_demand', 'İhtiyaç olduğunda')}${r('routine', 'Sürekli (takip yok)')}</div>
      <small class="muted" data-show="on_demand">Toplantı ikramı gibi düzenli olmayan işler için. Takvime bağlı değildir: personel iş çıktıkça istediği kadar işaretler; işaretlenmeyen gün “yapılmadı” sayılmaz ve başarı oranını etkilemez. Raporda kaç kez yapıldığı görünür.</small>
      <small class="muted" data-show="routine">Bulaşık yıkama, çay hazırlama gibi zaten fiilen yapılan işler için. Personel ekranında bilgi olarak görünür ama işaretlenmez; hiçbir sayıma ve orana girmez. Görev tebliğ belgesinde yer alır.</small>
      <div class="inline" data-show="every_n_days"><input type="number" min="2" max="365" name="${prefix}_n_days" value="${t === 'every_n_days' ? v.freq_interval || 2 : 2}"> iş gününde bir</div>
      <div data-show="weekly" class="freq">
        <div class="days">${days}</div>
        <div class="inline"><input type="number" min="1" max="52" name="${prefix}_n_weeks" value="${t === 'weekly' ? v.freq_interval || 1 : 1}"> haftada bir</div>
      </div>
      <div class="inline" data-show="monthly"><input type="number" min="1" max="12" name="${prefix}_n_months" value="${t === 'monthly' ? v.freq_interval || 1 : 1}"> ayda bir, ayın
        <input type="number" min="1" max="31" name="${prefix}_md" value="${v.month_day || 1}">. günü</div>
      ${App.timesField(v, prefix)}
    </div>`;
  };
  /** Hedef saat(ler): günde birden çok kez yapılan işler için saat eklenebilir. */
  App.timesField = (v, prefix) => {
    const list = String(v.times || '').split(',').map((x) => x.trim()).filter(Boolean);
    const times = list.length > 1 ? list : [v.due_time || ''];
    const row = (t, i) => `<span class="time-chip"><input type="time" name="${prefix}_time" value="${App.h(t)}" aria-label="${i + 1}. saat">${i ? '<button type="button" class="btn icon sm ghost" data-trm title="Saati kaldır">' + App.icon('x') + '</button>' : ''}</span>`;
    return `<div class="times-field" data-times>
      <div class="inline"><span data-tlabel>${times.length > 1 ? 'Kontrol saatleri' : 'Hedef saat'}</span><span class="time-list">${times.map(row).join('')}</span>
        <button type="button" class="btn sm ghost" data-tadd>${App.icon('plus')}<span>Saat ekle</span></button></div>
      <small class="muted" data-thint>${times.length > 1 ? `Günde ${times.length} kez: personel her saat için ayrı bir kontrol işaretler. Bir kontrol, sonraki kontrolün saati geldiğinde hâlâ yapılmamışsa “yapılmadı” sayılır.` : 'Boş bırakılırsa gün sonuna kadar. Günde birden çok kez yapılacaksa (ör. tuvalet kontrolü günde 4 kez) “Saat ekle”ye basın.'}</small></div>`;
  };

  App.bindFreq = (root) => {
    App.$$('[data-freq]', root).forEach((f) => {
      if (f.dataset.bound) return; f.dataset.bound = 1;
      const p = f.dataset.freq;
      const tf = f.querySelector('[data-times]');
      const relabel = () => {
        const n = App.$$('input[type=time]', tf).length;
        tf.querySelector('[data-tlabel]').textContent = n > 1 ? 'Kontrol saatleri' : 'Hedef saat';
        tf.querySelector('[data-thint]').textContent = n > 1
          ? `Günde ${n} kez: personel her saat için ayrı bir kontrol işaretler. Bir kontrol, sonraki kontrolün saati geldiğinde hâlâ yapılmamışsa “yapılmadı” sayılır.`
          : 'Boş bırakılırsa gün sonuna kadar. Günde birden çok kez yapılacaksa (ör. tuvalet kontrolü günde 4 kez) “Saat ekle”ye basın.';
      };
      tf.addEventListener('click', (e) => {
        if (e.target.closest('[data-tadd]')) {
          const inputs = App.$$('input[type=time]', tf);
          if (inputs.length >= 12) { App.toast('Günde en fazla 12 kez seçilebilir', 'bad'); return; }
          // Yeni saati son saatin 2,5 saat sonrasına öner.
          const last = inputs[inputs.length - 1].value || '09:00';
          const [hh, mm] = last.split(':').map(Number);
          const m = Math.min(23 * 60 + 30, hh * 60 + mm + 150);
          const chip = App.el(`<span class="time-chip"><input type="time" name="${p}_time" value="${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}"><button type="button" class="btn icon sm ghost" data-trm title="Saati kaldır">${App.icon('x')}</button></span>`);
          tf.querySelector('.time-list').appendChild(chip);
          relabel();
        }
        const rm = e.target.closest('[data-trm]');
        if (rm) { rm.closest('.time-chip').remove(); relabel(); }
      });
      const sync = () => {
        const t = (f.querySelector(`input[name=${p}_type]:checked`) || {}).value;
        App.$$(':scope > [data-show]', f).forEach((s) => { s.hidden = s.dataset.show !== t; });
        if (tf) tf.hidden = t === 'on_demand' || t === 'routine';
      };
      f.addEventListener('change', sync); sync();
    });
  };
  App.readFreq = (f) => {
    const p = f.dataset.freq;
    const val = (n) => (f.querySelector(`[name=${p}_${n}]`) || {}).value;
    const t = f.querySelector(`input[name=${p}_type]:checked`).value;
    const times = [...new Set(App.$$(`input[name=${p}_time]`, f).map((i) => i.value).filter(Boolean))].sort();
    const o = { freq_type: t, freq_interval: 1, weekdays: null, month_day: null, due_time: times[0] || null, times: times.length > 1 ? times.join(',') : null };
    if (t === 'every_n_days') o.freq_interval = +val('n_days') || 2;
    if (t === 'weekly') { o.freq_interval = +val('n_weeks') || 1; o.weekdays = App.$$(`input[name=${p}_wd]:checked`, f).map((i) => i.value).join(','); }
    if (t === 'monthly') { o.freq_interval = +val('n_months') || 1; o.month_day = +val('md') || 1; }
    if (t === 'on_demand' || t === 'routine') { o.due_time = null; o.times = null; }
    return o;
  };

  /* ---------- giriş ---------- */
  App.initLogin = () => {
    const f = document.getElementById('login-form');
    const alert = f.querySelector('.alert');
    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      const b = f.querySelector('button[type=submit]');
      b.classList.add('loading'); alert.hidden = true;
      try {
        await App.api('login', App.formData(f));
        App.confetti(innerWidth / 2, innerHeight / 2, 30);
        setTimeout(() => location.reload(), 350);
      } catch (err) {
        alert.textContent = err.message; alert.hidden = false;
        f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
        b.classList.remove('loading');
      }
    });
  };

  App.photoUrl = (c) => 'photo.php?id=' + c.id;
  App.download = (url) => { location.href = url; };

  App.logout = async () => {
    try { await App.api('logout', {}); } catch (e) { /* yoksay */ }
    location.href = 'index.php';
  };

  App.changePassword = () => {
    App.modal({
      title: 'Şifre değiştir',
      body: `<form class="form"><label class="field"><span>Mevcut şifre</span><input type="password" name="current" autocomplete="current-password"></label>
        <label class="field"><span>Yeni şifre</span><input type="password" name="new" autocomplete="new-password" minlength="6"></label></form>`,
      actions: [{ label: 'Vazgeç', cls: 'ghost' }, {
        label: 'Kaydet', cls: 'primary', onClick: async (m) => {
          await App.api('password', App.formData(m.body.querySelector('form')));
          App.toast('Şifreniz güncellendi');
        },
      }],
    });
  };

  /** Telefonda çekilen fotoğrafı yüklemeden önce küçültür. */
  App.shrinkImage = (file, max) => new Promise((resolve) => {
    max = max || 1400;
    if (!file || !/^image\//.test(file.type)) return resolve(file);
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob((b) => resolve(b ? new File([b], 'foto.jpg', { type: 'image/jpeg' }) : file), 'image/jpeg', 0.82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
})();

/* ---------- iş detay / işaretleme penceresi (personel ve yönetici ortak) ---------- */
(function () {
  'use strict';
  const { h, icon, badge } = App;

  App.canUndo = (it) => {
    const me = window.BOOT && BOOT.user;
    if (!it.completion || !me) return false;
    if (me.role === 'admin') return true;
    return !it.completion.inspected && it.completion.by_id === me.id && it.completion.at.slice(0, 10) === App.today();
  };

  App.completeItem = async (it, status, note, photo) => {
    const fd = new FormData();
    fd.append('plan_id', it.plan_id);
    fd.append('occ_date', it.occ_date);
    fd.append('slot', it.slot || 0);
    fd.append('status', status || 'done');
    if (note) fd.append('note', note);
    if (photo) fd.append('photo', photo, photo.name || 'foto.jpg');
    return App.api('complete', fd);
  };
  App.uncompleteItem = (it) => App.api('uncomplete', { plan_id: it.plan_id, occ_date: it.occ_date, slot: it.slot || 0 });
  App.replaceItem = (it, revert) => App.api('mark_replaced', { plan_id: it.plan_id, occ_date: it.occ_date, slot: it.slot || 0, revert: revert ? 1 : 0 });
  App.inspectItem = (it, revert) => App.api('inspect', { plan_id: it.plan_id, occ_date: it.occ_date, slot: it.slot || 0, revert: revert ? 1 : 0 });
  /** Yönetici kontrol ettiyse küçük yıldız */
  App.star = (it) => (it.completion && it.completion.inspected
    ? `<span class="star" title="Yönetici kontrol etti${it.completion.inspected.by ? ': ' + h(it.completion.inspected.by) : ''}" aria-label="Yönetici kontrol etti"><svg viewBox="0 0 24 24">${'<path d="M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/>'}</svg></span>` : '');
  /** Bir kaydın benzersiz anahtarı: plan|tarih|kontrol */
  App.itemKey = (it) => it.plan_id + '|' + it.occ_date + '|' + (it.slot || 0);
  /** "2/4" gibi kontrol etiketi (günde tek seferlik işlerde boş) */
  App.slotLabel = (it) => (it.slot_count > 1 ? `${(it.slot || 0) + 1}/${it.slot_count}` : '');

  App.taskSheet = (it, onChange) => {
    const c = it.completion;
    const isAdmin = BOOT.user.role === 'admin';
    const canMark = !c && it.status !== 'upcoming' && (it.status !== 'missed' || isAdmin);
    const carried = it.occ_date !== App.today();
    let body = `<div class="sheet-task">
      <div class="meta">${App.itemBadge(it)}${it.kind === 'consumable' ? '<span class="badge plain cons">Sarf malzemesi</span>' : ''}<span class="tag">${icon('pin')}${h(it.location)}</span>
        <span class="tag">${icon('refresh')}${h(it.freq)}</span>
        ${it.due_time ? `<span class="tag">${icon('clock')}${it.slot_count > 1 ? h(App.slotLabel(it)) + '. kontrol · ' : ''}${h(it.due_time)}</span>` : ''}
        ${carried ? `<span class="tag">${icon('calendar')}${h(App.fmtDate(it.occ_date, true))}</span>` : ''}
        ${it.user ? `<span class="tag">${icon('user')}${h(it.user)}</span>` : '<span class="tag">' + icon('users') + 'Ortak iş</span>'}</div>
      ${it.task_desc ? `<p class="muted">${h(it.task_desc)}</p>` : ''}
      ${it.note ? `<div class="alert info">${h(it.note)}</div>` : ''}
      ${it.status === 'leave' ? `<div class="alert leave">${h(it.user || 'Sorumlu')} bu gün izinli; iş “yapılmadı” sayılmaz. Yine de yapıldıysa işaretleyebilirsiniz.</div>` : ''}`;
    if (c) {
      body += `<div class="glass card" style="padding:14px">
        <div style="display:flex;gap:10px;align-items:center">${App.avatar(c.by || '?')}<div><b>${h(c.by || '')}</b>
        <div class="muted small">${h(App.relDay(c.at))} ${h(App.fmtTime(c.at))}${c.late ? ' · <span style="color:var(--warn);font-weight:700">geç yapıldı</span>' : ''}</div></div></div>
        ${c.note ? `<p style="margin-top:10px">${h(c.note)}</p>` : ''}
        ${c.inspected ? `<div class="inspected-line">${App.star(it)}<span><b>Yönetici kontrol etti</b> · ${h(c.inspected.by || '')} · ${h(App.relDay(c.inspected.at))} ${h(App.fmtTime(c.inspected.at))}</span></div>` : ''}
        ${c.photo ? `<img class="photo-thumb" src="${App.h(App.photoUrl(c))}" alt="Fotoğraf" loading="lazy">` : ''}</div>`;
    } else if (canMark) {
      body += `<label class="field"><span>Not (isteğe bağlı, sorun bildirirken zorunlu)</span><textarea name="note" placeholder="Örn. sabun bitti, depodan istendi"></textarea></label>
        <label class="photo-drop">${icon('camera')}<span>Fotoğraf ekle (isteğe bağlı)</span><input type="file" accept="image/*" capture="environment" hidden></label>
        ${it.kind === 'consumable'
          ? `<div class="big-actions three"><button class="btn warn" data-act="issue">${icon('flag')}<span>Sorun var</span></button>
            <button class="btn success" data-act="done">${icon('check')}<span>Kontrol edildi</span></button>
            <button class="btn replace" data-act="replaced">${icon('swap')}<span>Değiştirildi</span></button></div>
            <p class="muted small">Listede tek dokunuş “Kontrol edildi”, ikinci dokunuş “Değiştirildi” olarak kaydeder.</p>`
          : `<div class="big-actions"><button class="btn warn" data-act="issue">${icon('flag')}<span>Sorun var</span></button>
            <button class="btn success" data-act="done">${icon('check')}<span>Tamamlandı</span></button></div>`}`;
    } else if (it.status === 'missed') {
      body += `<div class="alert bad">Bu işin süresi geçti, yapılmadı olarak kaydedildi.</div>`;
    }
    body += '</div>';

    const actions = [];
    if (c && it.kind === 'consumable' && c.status !== 'issue' && App.canUndo(it)) {
      const toReplaced = c.status !== 'replaced';
      actions.push({ label: toReplaced ? 'Değiştirildi olarak işaretle' : '“Kontrol edildi”ye çevir', cls: toReplaced ? 'replace' : '', icon: 'swap', onClick: async () => {
        await App.replaceItem(it, !toReplaced); App.toast(toReplaced ? 'Değiştirildi olarak kaydedildi' : 'Kontrol edildi olarak kaydedildi'); onChange && onChange();
      } });
    }
    if (c && isAdmin) {
      const ins = !!c.inspected;
      actions.push({ label: ins ? 'Kontrolü kaldır' : 'Kontrol ettim', cls: ins ? 'ghost' : 'inspect', icon: 'star', onClick: async () => {
        await App.inspectItem(it, ins);
        App.toast(ins ? 'Kontrol işareti kaldırıldı' : 'Kontrol edildi olarak işaretlendi; personele bildirildi', 'info');
        onChange && onChange();
      } });
    }
    if (c && App.canUndo(it)) {
      actions.push({ label: 'İşareti geri al', cls: 'danger', icon: 'refresh', onClick: async () => {
        await App.uncompleteItem(it); App.toast('İşaret geri alındı', 'info'); onChange && onChange();
      } });
    }
    const m = App.modal({ title: it.task, body, actions });
    if (!canMark) return m;

    let photo = null;
    const drop = m.body.querySelector('.photo-drop');
    const input = drop.querySelector('input');
    input.onchange = async () => {
      if (!input.files[0]) return;
      photo = await App.shrinkImage(input.files[0]);
      const url = URL.createObjectURL(photo);
      drop.innerHTML = `<img src="${url}" alt=""><span>Değiştirmek için dokunun</span>`;
      drop.appendChild(input);
    };
    App.$$('[data-act]', m.body).forEach((b) => {
      b.onclick = async () => {
        const status = b.dataset.act;
        const note = m.body.querySelector('textarea').value.trim();
        if (status === 'issue' && !note) { App.toast('Lütfen sorunu kısaca yazın', 'bad'); m.body.querySelector('textarea').focus(); return; }
        b.classList.add('loading');
        try {
          const r = await App.completeItem(it, status, note, photo);
          const rect = b.getBoundingClientRect();
          if (status !== 'issue') App.confetti(rect.left + rect.width / 2, rect.top, 30);
          App.toast(status === 'replaced' ? 'Değiştirildi olarak kaydedildi' : status === 'done' ? (it.kind === 'consumable' ? 'Kontrol edildi' : 'Harika, iş tamamlandı!') : 'Sorun bildirildi', status === 'issue' ? 'info' : '');
          m.close();
          onChange && onChange(r);
        } catch (e) { App.err(e); b.classList.remove('loading'); }
      };
    });
    return m;
  };
})();

</script>
<script>
window.__runAdmin = function () {
/* İş Takip — yönetici paneli */
(function () {
  'use strict';
  const { h, icon, $, $$, api } = App;
  const me = BOOT.user;
  const root = document.getElementById('app');

  const ROUTES = [
    { id: 'panel', label: 'Günlük Durum', short: 'Durum', icon: 'home', view: viewDashboard },
    { id: 'bildirimler', label: 'Gelen Bildirimler', short: 'Bildirim', icon: 'flag', view: viewInbox },
    { id: 'atamalar', label: 'İş Atamaları', short: 'Atamalar', icon: 'list', view: viewPlans },
    { id: 'paketler', label: 'İş Paketleri', short: 'Paketler', icon: 'layers', view: viewPackages },
    { id: 'isler', label: 'İş Tanımları', short: 'İşler', icon: 'check', view: viewTasks },
    { id: 'mekanlar', label: 'Mekanlar', short: 'Mekanlar', icon: 'pin', view: viewLocations },
    { id: 'personel', label: 'Personel', short: 'Personel', icon: 'users', view: viewUsers },
    { id: 'raporlar', label: 'Raporlar', short: 'Rapor', icon: 'chart', view: viewReports },
    { id: 'ayarlar', label: 'Ayarlar', short: 'Ayarlar', icon: 'gear', view: viewSettings },
  ];

  let timer = null;
  const cache = {};
  async function get(name, force) {
    if (force || !cache[name]) cache[name] = await api(name);
    return cache[name];
  }
  function invalidate(...names) { names.forEach((n) => delete cache[n]); }

  /* ---------- iskelet ---------- */
  root.innerHTML = `<div class="shell">
    <aside class="side"><div class="glass nav-card">
      <div class="brand"><div class="brand-mark">${App.LOGO}</div>
        <div><b>${h(BOOT.company)}</b><small>Yönetim paneli</small></div></div>
      <nav class="nav"><span class="pill"></span>${ROUTES.map((r) => `<a href="#/${r.id}" data-r="${r.id}">${icon(r.icon)}<span>${r.label}</span></a>`).join('')}</nav>
      <div class="side-foot">
        <a class="btn sm block" href="index.php?view=staff">${icon('phone')}<span>Personel ekranı</span></a>
        <div class="me">${App.avatar(me.name)}<div style="flex:1;min-width:0"><b>${h(me.name)}</b><small>Yönetici</small></div>
          <button class="btn icon sm ghost" data-pw title="Şifre değiştir">${icon('key')}</button>
          <button class="btn icon sm ghost" data-out title="Çıkış">${icon('logout')}</button></div>
      </div></div></aside>
    <main class="main">
      <div class="topbar glass"><div class="brand-mark">${App.LOGO}</div>
        <b>${h(BOOT.company)}</b>
        <a class="btn icon sm" href="index.php?view=staff" title="Personel ekranı">${icon('phone')}</a>
        <button class="btn icon sm" data-out title="Çıkış">${icon('logout')}</button></div>
      <div id="view"></div>
    </main>
    <nav class="tabbar glass">${ROUTES.map((r) => `<a href="#/${r.id}" data-r="${r.id}">${icon(r.icon)}<span>${r.short}</span></a>`).join('')}</nav>
  </div>`;
  $$('[data-out]').forEach((b) => (b.onclick = App.logout));
  $('[data-pw]').onclick = App.changePassword;
  const viewEl = $('#view');

  function setActive(id) {
    $$('[data-r]').forEach((a) => a.classList.toggle('active', a.dataset.r === id));
    const a = $(`.nav a[data-r="${id}"]`);
    const pill = $('.nav .pill');
    if (a && pill) { pill.style.transform = `translateY(${a.offsetTop}px)`; pill.style.height = a.offsetHeight + 'px'; }
    const t = $(`.tabbar a[data-r="${id}"]`);
    if (t) t.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
  }

  async function route() {
    clearInterval(timer);
    const id = (location.hash.match(/^#\/([\w-]+)/) || [])[1] || 'panel';
    const r = ROUTES.find((x) => x.id === id) || ROUTES[0];
    setActive(r.id);
    document.title = r.label + ' · ' + BOOT.company;
    viewEl.innerHTML = '';
    const v = document.createElement('div');
    v.className = 'view';
    viewEl.appendChild(v);
    try { await r.view(v); } catch (e) { App.err(e); }
  }
  window.addEventListener('hashchange', route);

  /* Gelen bildirim sayısı: menüde rozet */
  let inboxNew = 0;
  async function refreshInbox() {
    try {
      const c = await api('reports_count');
      inboxNew = c.new;
      $$('[data-r="bildirimler"]').forEach((a) => {
        let b = a.querySelector('.count');
        if (!c.new) { if (b) b.remove(); return; }
        if (!b) { b = App.el('<span class="count"></span>'); a.appendChild(b); }
        if (b.textContent !== String(c.new)) { b.textContent = c.new; b.style.animation = 'none'; void b.offsetWidth; b.style.animation = ''; }
      });
    } catch (e) { /* sessiz */ }
    return inboxNew;
  }
  refreshInbox();
  setInterval(() => { if (!document.hidden) refreshInbox(); }, 60000);
  window.addEventListener('resize', () => setActive((location.hash.match(/^#\/([\w-]+)/) || [])[1] || 'panel'));

  const head = (title, sub, tools) => `<div class="page-head"><div><h2>${h(title)}</h2>${sub ? `<p>${sub}</p>` : ''}</div><div class="toolbar">${tools || ''}</div></div>`;
  const emptyBox = (emoji, title, text, btn) => `<div class="empty"><div class="big">${emoji}</div><b>${h(title)}</b><span>${h(text || '')}</span>${btn || ''}</div>`;
  const skel = (n, hgt) => `<div class="grid">${`<div class="skeleton" style="height:${hgt || 56}px"></div>`.repeat(n || 4)}</div>`;
  const staffOptions = (users, sel, allLabel) => `<option value="">${h(allLabel || 'Ortak (tüm personel)')}</option>` +
    users.map((u) => `<option value="${u.id}" ${String(sel) === String(u.id) ? 'selected' : ''}>${h(u.name)}${u.role === 'admin' ? ' (yönetici)' : ''}</option>`).join('');
  const locOptions = (locs, sel, allLabel) => (allLabel !== undefined ? `<option value="">${h(allLabel)}</option>` : '') +
    locs.map((l) => `<option value="${l.id}" ${String(sel) === String(l.id) ? 'selected' : ''}>${h(l.name)}</option>`).join('');
  const taskDatalist = (tasks, id) => `<datalist id="${id}">${tasks.map((t) => `<option value="${h(t.name)}">`).join('')}</datalist>`;

  /* =========================================================
     Günlük durum paneli
     ========================================================= */
  async function viewDashboard(v) {
    let date = sessionStorage.getItem('istakip.dash') || App.today();
    if (date > App.today()) date = App.today();
    let filter = 'all';
    let q = '';
    let data = null;

    v.innerHTML = head('Günlük Durum', '', `
      <button class="btn icon" data-prev title="Önceki gün">${icon('chev', '')}</button>
      <input type="date" data-date value="${date}" max="${App.today()}">
      <button class="btn icon" data-next title="Sonraki gün">${icon('chev')}</button>
      <button class="btn" data-today>Bugün</button>
      <button class="btn icon" data-refresh title="Yenile">${icon('refresh')}</button>`) +
      `<div data-inbox-alert></div><div class="stats stagger" data-stats>${'<div class="skeleton" style="height:118px;border-radius:22px"></div>'.repeat(6)}</div>
      <div class="dash-grid"><div class="glass card" data-list>${skel(6)}</div><div class="grid" data-side></div></div>`;
    $('[data-prev] svg', v).style.transform = 'rotate(180deg)';
    const sub = $('.page-head p', v) || App.el('<p></p>');
    if (!$('.page-head p', v)) $('.page-head > div', v).appendChild(sub);

    const setDate = (d) => { if (d > App.today()) d = App.today(); date = d; sessionStorage.setItem('istakip.dash', d); $('[data-date]', v).value = d; load(); };
    $('[data-prev]', v).onclick = () => setDate(App.addDays(date, -1));
    $('[data-next]', v).onclick = () => setDate(App.addDays(date, 1));
    $('[data-today]', v).onclick = () => setDate(App.today());
    $('[data-date]', v).onchange = (e) => e.target.value && setDate(e.target.value);
    $('[data-refresh]', v).onclick = () => load();

    async function load() {
      try {
        data = await api('dashboard', null, { date });
        render();
        refreshInbox().then((n) => {
          const box = $('[data-inbox-alert]', v);
          if (box) box.innerHTML = n ? `<a class="alert inbox-alert lift" href="#/bildirimler">${icon('flag')}<span><b>${n} yeni sorun bildirimi</b> var. Karekodla gönderilen bildirimleri görmek için tıklayın.</span>${icon('chev')}</a>` : '';
        });
      } catch (e) { App.err(e); }
    }

    function render() {
      const t = data.tally;
      const isToday = data.date === data.today;
      sub.innerHTML = `${h(App.fmtDate(data.date, true))}${isToday ? ` · saat ${h(data.now)}` : ''}${data.workday ? '' : ' · <b>iş günü değil</b>'}`;
      const stat = (key, lbl, n, c, ic) => `<div class="glass stat lift clickable" data-filter="${key}" style="--c:${c}">
        <div class="top"><span class="lbl">${lbl}</span><span class="icon">${icon(ic)}</span></div>
        <div class="num" data-n="${n}">0</div><span class="spark"></span></div>`;
      $('[data-stats]', v).innerHTML =
        stat('all', 'Toplam iş', t.total, '#6366f1', 'list') +
        stat('closed', 'Tamamlanan', t.done + t.issue, '#10b981', 'check') +
        stat('pending', 'Bekleyen', t.pending, '#64748b', 'clock') +
        stat('overdue', 'Geciken', t.overdue, '#f59e0b', 'alert') +
        stat('issues', 'Sorun bildirilen (7 gün)', data.issue_count, '#8b5cf6', 'flag') +
        stat('missed', 'Yapılmayan (7 gün)', data.missed_count, '#ef4444', 'x');
      $$('[data-n]', v).forEach((n) => App.countUp(n, +n.dataset.n));
      $$('[data-filter]', v).forEach((s) => (s.onclick = () => {
        if (s.dataset.filter === 'missed') { $('[data-missed]', v)?.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
        if (s.dataset.filter === 'issues') { $('[data-issues]', v)?.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
        filter = s.dataset.filter; renderList(); $('[data-list]', v).scrollIntoView({ behavior: 'smooth', block: 'start' });
      }));
      renderList();
      renderSide();
    }

    function renderList() {
      const box = $('[data-list]', v);
      const f = (it) => filter === 'all' ? true : filter === 'closed' ? (it.status === 'done' || it.status === 'issue') : it.status === filter;
      const qq = q.toLocaleLowerCase('tr');
      const items = data.items.filter(f).filter((it) => !qq || (it.task + ' ' + it.location + ' ' + (it.user || '')).toLocaleLowerCase('tr').includes(qq));
      const chip = (k, l, n) => `<button class="chip ${filter === k ? 'active' : ''}" data-chip="${k}">${l}<span class="n">${n}</span></button>`;
      const t = data.tally;
      let html = `<div class="card-head"><h3>İş listesi</h3><input type="search" placeholder="Ara: iş, mekan, kişi" value="${h(q)}" data-q style="max-width:240px;min-height:38px"></div>
        <div class="chips" style="margin-bottom:8px">${chip('all', 'Tümü', t.total)}${chip('overdue', 'Geciken', t.overdue)}${chip('pending', 'Bekleyen', t.pending)}${chip('closed', 'Tamamlanan', t.done + t.issue)}${chip('issue', 'Sorunlu', t.issue)}${t.leave ? chip('leave', 'İzinli', t.leave) : ''}</div>`;
      if (!data.items.length) {
        html += emptyBox(data.workday ? '🗂️' : '🌴', data.workday ? 'Bu gün için planlanmış iş yok' : 'Bu gün iş günü değil',
          data.workday ? 'İş paketlerinden atama yaparak başlayın.' : 'Çalışma günlerini Ayarlar’dan değiştirebilirsiniz.',
          data.workday ? `<a class="btn primary" href="#/paketler">${icon('layers')}<span>Paketlerden ata</span></a>` : '');
      } else if (!items.length) {
        html += emptyBox('🔍', 'Bu filtrede iş yok', '');
      } else {
        const groups = new Map();
        items.forEach((it) => { if (!groups.has(it.location)) groups.set(it.location, []); groups.get(it.location).push(it); });
        html += '<div class="table-wrap"><table><thead><tr><th>İş</th><th>Sorumlu</th><th>Saat</th><th>Durum</th><th>Kim / ne zaman</th></tr></thead><tbody>';
        for (const [loc, list] of groups) {
          html += `<tr class="group"><td colspan="5">${icon('pin')} ${h(loc)} <span class="muted">· ${list.length}</span></td></tr>`;
          html += list.map((it) => `<tr data-key="${App.itemKey(it)}" style="cursor:pointer">
            <td><b>${h(it.task)}</b>${it.slot_count > 1 ? ` <span class="slot-pill">${h(App.slotLabel(it))}</span>` : ''}<div class="muted small">${h(it.freq)}${it.occ_date !== data.date ? ' · ' + h(App.fmtDate(it.occ_date)) + ' tarihli' : ''}</div></td>
            <td class="nowrap">${it.user ? h(it.user) : '<span class="muted">Ortak</span>'}</td>
            <td class="nowrap">${h(it.due_time || '—')}</td>
            <td class="nowrap">${App.itemBadge(it)}${App.star(it)}${it.completion && it.completion.late ? ' <span class="badge overdue plain">geç</span>' : ''}</td>
            <td class="nowrap small">${it.completion ? `${h(it.completion.by || '')} · ${h(App.fmtTime(it.completion.at))}${it.completion.photo ? ' ' + icon('camera') : ''}${it.completion.note ? ' 💬' : ''}` : '<span class="muted">—</span>'}</td></tr>`).join('');
        }
        html += '</tbody></table></div>';
      }
      box.innerHTML = html;
      $$('[data-chip]', box).forEach((c) => (c.onclick = () => { filter = c.dataset.chip; renderList(); }));
      const qi = $('[data-q]', box);
      qi.oninput = () => { q = qi.value; const pos = qi.selectionStart; renderList(); const n = $('[data-q]', box); n.focus(); n.setSelectionRange(pos, pos); };
      $$('tr[data-key]', box).forEach((tr) => (tr.onclick = () => {
        const it = data.items.find((i) => App.itemKey(i) === tr.dataset.key);
        App.taskSheet(it, load);
      }));
    }

    function bars(list, emptyText) {
      if (!list.length) return `<p class="muted small">${h(emptyText)}</p>`;
      return '<div class="bars">' + list.map((g) => {
        const w = (n) => (g.total ? (n * 100) / g.total : 0).toFixed(1);
        return `<div class="bar-row" title="${g.done} yapıldı · ${g.issue} sorun · ${g.overdue} gecikmiş · ${g.pending} bekliyor${g.leave ? ' · ' + g.leave + ' izinli' : ''}">
          <div class="meta"><b>${h(g.name)}</b><span>${g.done + g.issue}/${g.total} · %${g.rate}</span></div>
          <div class="track-h"><i class="ok" data-w="${w(g.done)}"></i><i class="issue" data-w="${w(g.issue)}"></i><i class="warn" data-w="${w(g.overdue)}"></i><i class="bad" data-w="${w(g.missed)}"></i><i class="leave" data-w="${w(g.leave)}"></i></div></div>`;
      }).join('') + '</div>';
    }

    function renderSide() {
      const t = data.tally;
      const side = $('[data-side]', v);
      side.innerHTML = `
        <div class="glass card" style="display:flex;gap:18px;align-items:center" data-tilt="4">
          ${App.ring(t.rate, 120, undefined, 'tamamlandı')}
          <div class="grid" style="gap:6px"><h3>Genel ilerleme</h3>
            <p class="muted small">${t.done + t.issue} / ${t.total} iş kapandı</p>
            <div class="legend"><span><i style="background:var(--ok)"></i>Yapıldı</span><span><i style="background:var(--issue)"></i>Sorun</span><span><i style="background:var(--warn)"></i>Gecikti</span></div>
            <p class="muted small">${data.staff_count} aktif personel</p>
            ${data.on_leave.length ? `<div class="small"><span class="badge leave">İzinli</span> ${data.on_leave.map((u) => h(u.name)).join(', ')}</div>` : ''}</div></div>
        <div class="glass card" data-issues><div class="card-head"><h3>Bildirilen sorunlar</h3><span class="badge issue">${data.issue_count}</span></div>
          ${data.issues.length ? '<div class="list">' + data.issues.map((it, i) => `<div class="row clickable" data-issue="${i}" style="cursor:pointer">
            <span class="dot" style="background:var(--issue)"></span>
            <div style="min-width:0"><div class="title">${h(it.task)}${it.slot_count > 1 ? ` <span class="slot-pill">${h(App.slotLabel(it))}</span>` : ''}</div>
              <div class="issue-note">“${h(it.completion.note || '')}”${it.completion.photo ? ' ' + icon('camera') : ''}</div>
              <div class="sub"><span>${h(it.location)}</span><span>${h(it.completion.by || '')}</span></div></div>
            <span class="small muted nowrap">${h(App.relDay(it.completion.at))} ${h(App.fmtTime(it.completion.at))}</span></div>`).join('') + '</div>'
            : '<p class="muted small">Son 7 günde bildirilen sorun yok. 👍</p>'}</div>
        ${data.on_demand && data.on_demand.length ? `<div class="glass card"><div class="card-head"><h3>İhtiyaç olduğunda</h3><span class="badge plain upcoming">${data.on_demand.reduce((n, o) => n + o.count, 0)} kayıt</span></div>
          <div class="list">${data.on_demand.map((o) => `<div class="row">
            <span class="od-num${o.count ? ' on' : ''}" style="width:34px;height:34px;font-size:14px;${o.count ? 'color:#fff;border-style:solid;border-color:transparent;background:linear-gradient(135deg,#3b82f6,#06b6d4)' : ''}">${o.count}</span>
            <div><div class="title">${h(o.task)}</div><div class="sub"><span>${h(o.location)}</span><span>${h(o.user || 'Ortak')}</span>
              ${o.entries.length ? `<span>${o.entries.map((e) => h(App.fmtTime(e.at)) + (e.note ? ' 💬' : '')).join(', ')}</span>` : '<span>Bugün yapılmadı</span>'}</div>
              ${o.entries.filter((e) => e.note).map((e) => `<div class="muted small">💬 ${h(App.fmtTime(e.at))} · ${h(e.note)}</div>`).join('')}</div><span></span></div>`).join('')}</div>
          <p class="muted small" style="margin-top:8px">Düzenli olmayan işler; yapılmadığı gün eksik sayılmaz.</p></div>` : ''}
        <div class="glass card"><div class="card-head"><h3>Mekanlara göre</h3></div>${bars(data.by_location, 'Veri yok')}</div>
        <div class="glass card"><div class="card-head"><h3>Personele göre</h3></div>${bars(data.by_user, 'Veri yok')}</div>
        <div class="glass card" data-missed><div class="card-head"><h3>Son 7 günde yapılmayanlar</h3><span class="badge missed">${data.missed_count}</span></div>
          ${data.missed.length ? '<div class="list">' + data.missed.slice(0, 30).map((m) => `<div class="row">
            <span class="dot" style="background:var(--bad)"></span>
            <div><div class="title">${h(m.task)}${m.slot_count > 1 ? ` <span class="slot-pill">${h(App.slotLabel(m))}</span>` : ''} ${m.due_time ? '<span class="muted small">' + h(m.due_time) + '</span>' : ''}</div><div class="sub"><span>${h(m.location)}</span><span>${h(m.user || 'Ortak')}</span></div></div>
            <span class="small muted nowrap">${h(App.relDay(m.occ_date))}</span></div>`).join('') + '</div>' +
            (data.missed.length > 30 ? `<a class="btn sm block" href="#/raporlar" style="margin-top:10px">Tümünü raporda gör</a>` : '')
            : '<p class="muted small">Harika! Yapılmayan iş yok. ✨</p>'}</div>`;
      $$('[data-issue]', side).forEach((r) => (r.onclick = () => App.taskSheet(data.issues[+r.dataset.issue], load)));
      App.animateRings(side); App.animateBars(side);
    }

    await load();
    timer = setInterval(() => { if (date === App.today() && !document.hidden && !document.querySelector('.modal-back')) load(); }, 60000);
  }

  async function viewPlans(v) {
    v.innerHTML = head('İş Atamaları', 'Hangi işin, hangi mekanda, kim tarafından, ne sıklıkla yapılacağı', `
      <button class="btn" data-add>${icon('plus')}<span>Tek iş ekle</span></button>
      <button class="btn primary" data-apply>${icon('layers')}<span>Paketten ata</span></button>`) +
      `<div class="glass card" data-box>${skel(6)}</div>`;
    const [plans, locs, users] = await Promise.all([api('plans'), get('locations', true), get('users', true)]);
    let fLoc = sessionStorage.getItem('istakip.pl') || '';
    let fUser = sessionStorage.getItem('istakip.pu') || '';
    let q = '';
    const sel = new Set();
    $('[data-add]', v).onclick = () => planModal(null, () => route());
    $('[data-apply]', v).onclick = () => applyModal(null, () => route());

    function render() {
      const box = $('[data-box]', v);
      const qq = q.toLocaleLowerCase('tr');
      const list = plans.filter((p) => (!fLoc || String(p.location_id) === fLoc) &&
        (!fUser || (fUser === 'none' ? !p.user_id : String(p.user_id) === fUser)) &&
        (!qq || (p.task_name + ' ' + p.location_name).toLocaleLowerCase('tr').includes(qq)));
      let html = `<div class="toolbar" style="margin-bottom:12px">
        <select data-floc>${locOptions(locs, fLoc, 'Tüm mekanlar')}</select>
        <select data-fuser><option value="">Tüm personel</option><option value="none" ${fUser === 'none' ? 'selected' : ''}>Ortak işler</option>${users.map((u) => `<option value="${u.id}" ${fUser === String(u.id) ? 'selected' : ''}>${h(u.name)}</option>`).join('')}</select>
        <input type="search" placeholder="İş ara" data-q value="${h(q)}" style="max-width:220px">
        <span class="muted small">${list.length} atama</span>
        <span style="flex:1"></span>
        <span data-bulk ${sel.size ? '' : 'hidden'} class="toolbar"><b class="small">${sel.size} seçili</b>
          <button class="btn sm" data-reassign>${icon('swap')}<span>Devret</span></button>
          <button class="btn sm danger" data-bdel>${icon('trash')}<span>Kaldır</span></button></span></div>`;
      if (!plans.length) {
        html += emptyBox('🧭', 'Henüz iş ataması yok', 'Hazır bir iş paketini bir mekana ve personele atayarak hızlıca başlayabilirsiniz.',
          `<button class="btn primary" data-apply2>${icon('layers')}<span>Paketten ata</span></button>`);
      } else if (!list.length) {
        html += emptyBox('🔍', 'Filtreye uyan atama yok', '');
      } else {
        const groups = new Map();
        list.forEach((p) => { if (!groups.has(p.location_name)) groups.set(p.location_name, []); groups.get(p.location_name).push(p); });
        html += '<div class="table-wrap"><table><thead><tr><th style="width:30px"><label class="check"><input type="checkbox" data-all><span></span></label></th><th>İş</th><th>Sıklık</th><th>Saat</th><th>Sorumlu</th><th>Başlangıç</th><th></th></tr></thead><tbody>';
        for (const [loc, ps] of groups) {
          html += `<tr class="group"><td colspan="7">${icon('pin')} ${h(loc)} <span class="muted">· ${ps.length}</span></td></tr>`;
          html += ps.map((p) => `<tr>
            <td><label class="check"><input type="checkbox" data-sel="${p.id}" ${sel.has(p.id) ? 'checked' : ''}><span></span></label></td>
            <td><b>${h(p.task_name)}</b>${p.package_name ? `<div class="small" style="color:${h(p.package_color)}">● ${h(p.package_name)}</div>` : ''}${p.note ? `<div class="muted small">${h(p.note)}</div>` : ''}</td>
            <td class="nowrap">${h(p.freq)}</td><td class="small">${h(p.times ? p.times.split(',').join(' · ') : p.due_time || '—')}</td>
            <td class="nowrap">${p.user_name ? App.avatar(p.user_name, 24) + ' ' + h(p.user_name) : '<span class="muted">Ortak</span>'}</td>
            <td class="nowrap small">${h(App.fmtDate(p.start_date))}${p.end_date ? ' → ' + h(App.fmtDate(p.end_date)) : ''}</td>
            <td class="nowrap"><button class="btn icon sm ghost" data-edit="${p.id}" title="Düzenle">${icon('edit')}</button>
              <button class="btn icon sm ghost danger" data-del="${p.id}" title="Kaldır">${icon('trash')}</button></td></tr>`).join('');
        }
        html += '</tbody></table></div>';
      }
      box.innerHTML = html;
      $('[data-floc]', box).onchange = (e) => { fLoc = e.target.value; sessionStorage.setItem('istakip.pl', fLoc); render(); };
      $('[data-fuser]', box).onchange = (e) => { fUser = e.target.value; sessionStorage.setItem('istakip.pu', fUser); render(); };
      const qi = $('[data-q]', box);
      qi.oninput = () => { q = qi.value; const pos = qi.selectionStart; render(); const n = $('[data-q]', box); n.focus(); n.setSelectionRange(pos, pos); };
      const a2 = $('[data-apply2]', box); if (a2) a2.onclick = () => applyModal(null, () => route());
      $$('[data-edit]', box).forEach((b) => (b.onclick = () => planModal(plans.find((p) => p.id == b.dataset.edit), () => route())));
      $$('[data-del]', box).forEach((b) => (b.onclick = async () => {
        if (!(await App.confirm('Bu atama bugünden itibaren kaldırılacak. Geçmiş kayıtlar raporlarda kalır.', { ok: 'Kaldır' }))) return;
        try { await api('plan_delete', { id: b.dataset.del }); App.toast('Atama kaldırıldı'); route(); } catch (e) { App.err(e); }
      }));
      $$('[data-sel]', box).forEach((c) => (c.onchange = () => { c.checked ? sel.add(+c.dataset.sel) : sel.delete(+c.dataset.sel); render(); }));
      const all = $('[data-all]', box);
      if (all) {
        all.checked = list.length && list.every((p) => sel.has(p.id));
        all.onchange = () => { list.forEach((p) => (all.checked ? sel.add(p.id) : sel.delete(p.id))); render(); };
      }
      const bd = $('[data-bdel]', box);
      if (bd) bd.onclick = async () => {
        if (!(await App.confirm(sel.size + ' atama bugünden itibaren kaldırılacak.', { ok: 'Kaldır' }))) return;
        try { await api('plan_delete', { ids: [...sel] }); App.toast(sel.size + ' atama kaldırıldı'); route(); } catch (e) { App.err(e); }
      };
      const ra = $('[data-reassign]', box);
      if (ra) ra.onclick = () => App.modal({
        title: 'Seçili işleri devret',
        body: `<label class="field"><span>Yeni sorumlu</span><select name="u">${staffOptions(users, '')}</select></label>`,
        actions: [{ label: 'Vazgeç', cls: 'ghost' }, { label: 'Devret', cls: 'primary', onClick: async (m) => {
          await api('plans_reassign', { ids: [...sel], user_id: $('select', m.body).value });
          App.toast(sel.size + ' iş devredildi'); route();
        } }],
      });
    }
    render();
  }

  async function planModal(p, done) {
    const [locs, users, tasks] = await Promise.all([get('locations', true), get('users'), get('tasks', true)]);
    if (!locs.length) { App.toast('Önce en az bir mekan ekleyin', 'bad'); location.hash = '#/mekanlar'; return; }
    p = p || {};
    App.modal({
      title: p.id ? 'Atamayı düzenle' : 'Yeni iş ataması',
      wide: true,
      body: `<form class="form"><datalist id="dl-tasks"></datalist>
        <label class="field"><span>İş</span><input name="task_name" list="dl-tasks" value="${h(p.task_name || '')}" placeholder="Listeden seçin ya da yeni bir iş yazın" required></label>
        <div class="grid2">
          <label class="field"><span>Mekan</span><select name="location_id">${locOptions(locs, p.location_id)}</select></label>
          <label class="field"><span>Sorumlu</span><select name="user_id">${staffOptions(users, p.user_id)}</select></label>
        </div>
        <fieldset><legend>Sıklık</legend>${App.freqFields(p, 'pf')}</fieldset>
        <div class="grid2">
          <label class="field"><span>Başlangıç</span><input type="date" name="start_date" value="${h((p.start_date || App.today()).slice(0, 10))}"></label>
          <label class="field"><span>Bitiş (isteğe bağlı)</span><input type="date" name="end_date" value="${h((p.end_date || '').slice(0, 10))}"></label>
        </div>
        <label class="field"><span>Personele not (isteğe bağlı)</span><input name="note" value="${h(p.note || '')}" placeholder="Örn. Çamaşır suyu depodaki mavi dolapta"></label>
        ${p.id ? '<p class="muted small">Not: Sıklık, mekan veya sorumlu değişirse geçmiş kayıtlar korunur; değişiklik bugünden itibaren geçerli olur.</p>' : ''}
      </form>`,
      onOpen: (m) => {
        App.bindFreq(m.body);
        const f = $('form', m.body);
        // Seçilen mekanda tanımlı işler önce önerilir; yeni atamada işin varsayılan sıklığı doldurulur.
        const fillList = () => {
          const loc = locs.find((l) => l.id == f.location_id.value);
          const ids = new Set(loc ? loc.task_ids : []);
          const own = tasks.filter((t) => ids.has(t.id));
          const rest = tasks.filter((t) => !ids.has(t.id));
          $('#dl-tasks', f).innerHTML = own.concat(rest).map((t) => `<option value="${h(t.name)}">${ids.has(t.id) ? 'Bu mekanın işi' : ''}</option>`).join('');
          hint();
        };
        const hint = () => {
          const loc = locs.find((l) => l.id == f.location_id.value);
          const t = tasks.find((x) => x.name.toLocaleLowerCase('tr') === f.task_name.value.trim().toLocaleLowerCase('tr'));
          let el = $('[data-hint]', f);
          if (!el) { el = App.el('<p class="muted small" data-hint></p>'); f.task_name.closest('.field').appendChild(el); }
          el.textContent = !f.task_name.value.trim() ? (loc && loc.task_ids.length ? `${loc.name} için ${loc.task_ids.length} tanımlı iş var; listeden seçebilirsiniz.` : '')
            : !t ? 'Yeni iş olarak oluşturulacak ve bu mekana bağlanacak.'
            : loc && !loc.task_ids.includes(t.id) ? 'Bu iş henüz bu mekanda tanımlı değil; kaydedince mekana bağlanacak.' : '';
        };
        f.location_id.addEventListener('change', fillList);
        f.task_name.addEventListener('input', hint);
        f.task_name.addEventListener('change', () => {
          const t = tasks.find((x) => x.name.toLocaleLowerCase('tr') === f.task_name.value.trim().toLocaleLowerCase('tr'));
          if (t && !p.id) {
            const fs = $('[data-freq]', f).parentElement;
            fs.innerHTML = '<legend>Sıklık</legend>' + App.freqFields(t, 'pf');
            App.bindFreq(fs);
          }
          hint();
        });
        fillList();
      },
      actions: [{ label: 'Vazgeç', cls: 'ghost' }, { label: 'Kaydet', cls: 'primary', icon: 'check', onClick: async (m) => {
        const f = $('form', m.body);
        const d = Object.assign(App.formData(f), App.readFreq($('[data-freq]', f)));
        if (p.id) d.id = p.id;
        await api('plan_save', d);
        invalidate('tasks', 'locations');
        App.toast(p.id ? 'Atama güncellendi' : 'İş atandı');
        done && done();
      } }],
    });
  }

      body: `<form class="form">
        <label class="field"><span>İş paketi</span><select name="package_id">${pkgs.map((p) => `<option value="${p.id}" ${p.id == pkgId ? 'selected' : ''}>${h(p.name)} (${p.items.length} iş)</option>`).join('')}</select></label>

        </div>
        <p class="muted small" data-count></p></form>`,
      actions: [{ label: 'Vazgeç', cls: 'ghost' }, { label: 'Ata', cls: 'primary', icon: 'check', onClick: async (m) => {
        const d = App.formData($('form', m.body));
        if (!d.location_ids || !d.location_ids.length) throw new Error('En az bir mekan seçin.');
        const r = await api('package_apply', d);
        App.toast(`${r.created} iş atandı${r.skipped ? `, ${r.skipped} zaten vardı` : ''}`);
        const rect = m.root.querySelector('.modal').getBoundingClientRect();
        App.confetti(rect.left + rect.width / 2, rect.top + 40, 40);
        done && done();

    });

    const upd = () => {
      const p = pkgs.find((x) => x.id == f.package_id.value);
      const pv = $('[data-preview]', m.body);
      const all = pv.dataset.all === String(p.id);

      pv.innerHTML = `<div class="small" style="display:flex;flex-wrap:wrap;gap:6px">${shown.map((i) => `<span class="badge plain" style="--c:${h(p.color)}">${h(i.task_name)} · ${h(i.freq)}</span>`).join('')}

      const mb = $('[data-more]', pv);
      if (mb) mb.onclick = () => { pv.dataset.all = all ? '' : String(p.id); upd(); };
      const n = $$('input[name="location_ids[]"]:checked', f).length;
      $('[data-count]', m.body).textContent = n ? `${p.items.length} iş × ${n} mekan = ${p.items.length * n} atama oluşturulacak.` : 'Mekan seçin.';
    };
    f.addEventListener('change', upd); upd();
  }

  /* =========================================================
     Mekan ↔ iş ilişkisi: ortak seçim listesi
     ========================================================= */
  // items: [{id, name, sub?}], selected: id listesi
  function pickList(items, selected, name, emptyText) {
    const sel = new Set((selected || []).map(Number));
    if (!items.length) return `<p class="muted small">${h(emptyText || 'Liste boş.')}</p>`;
    return `<div class="pick" data-pick="${name}">
      <div class="pick-tools"><input type="search" placeholder="Ara" data-pq>
        <button type="button" class="btn sm ghost" data-pall>Tümünü seç</button><button type="button" class="btn sm ghost" data-pnone>Temizle</button>
        <span class="muted small" data-pcount></span></div>
      <div class="pick-items">${items.map((it) => `<label data-n="${h(it.name.toLocaleLowerCase('tr'))}"><input type="checkbox" name="${name}[]" value="${it.id}" ${sel.has(+it.id) ? 'checked' : ''}>
        <span>${h(it.name)}${it.sub ? `<small>${h(it.sub)}</small>` : ''}</span></label>`).join('')}</div></div>`;
  }
  function bindPick(root) {
    $$('[data-pick]', root).forEach((p) => {
      const boxes = () => $$('.pick-items input', p);
      const count = () => { const n = boxes().filter((b) => b.checked).length; $('[data-pcount]', p).textContent = n + ' seçili'; };
      $('[data-pq]', p).oninput = (e) => { const q = e.target.value.toLocaleLowerCase('tr'); $$('.pick-items label', p).forEach((l) => (l.hidden = !l.dataset.n.includes(q))); };
      $('[data-pall]', p).onclick = () => { boxes().forEach((b) => { if (!b.closest('label').hidden) b.checked = true; }); count(); };
      $('[data-pnone]', p).onclick = () => { boxes().forEach((b) => { if (!b.closest('label').hidden) b.checked = false; }); count(); };
      p.addEventListener('change', count); count();
    });
  }

    if (!mine.length) { App.toast('Bu mekana önce iş ekleyin', 'bad'); locationModal(l, 0, done); return; }
    const assigned = {};
    plans.filter((p) => p.location_id === l.id).forEach((p) => { assigned[p.task_id] = p.user_name || 'Ortak'; });
    const m = App.modal({
      title: l.name + ' — işleri ata',
      wide: true,
      body: `<form class="form">
        <div class="grid2"><label class="field"><span>Sorumlu personel</span><select name="user_id">${staffOptions(users, '')}</select></label>
          <label class="field"><span>Başlangıç tarihi</span><input type="date" name="start_date" value="${App.today()}"></label></div>
        <fieldset><legend>Atanacak işler <small class="muted">(işin varsayılan sıklığıyla)</small></legend>
        <div class="assign-list">${mine.map((t) => `<label class="check assign-row ${assigned[t.id] ? 'is-assigned' : ''}">
          <input type="checkbox" name="task_ids[]" value="${t.id}" ${assigned[t.id] ? 'disabled' : 'checked'}><span></span>
          <b>${h(t.name)}</b><small>${h(t.freq)}${t.due_time ? ' · ' + h(t.due_time) : ''}</small>
          ${assigned[t.id] ? `<em>Atanmış: ${h(assigned[t.id])}</em>` : ''}</label>`).join('')}</div></fieldset>
        <p class="muted small" data-count></p></form>`,
      actions: [{ label: 'Vazgeç', cls: 'ghost' }, { label: 'Ata', cls: 'primary', icon: 'check', onClick: async (mm) => {
        const d = App.formData($('form', mm.body));
        if (!d.task_ids || !d.task_ids.length) throw new Error('En az bir iş seçin.');
        const r = await api('location_assign', Object.assign(d, { location_id: l.id }));
        App.toast(`${r.created} iş atandı${r.skipped ? `, ${r.skipped} zaten atanmıştı` : ''}`);
        const rect = mm.root.querySelector('.modal').getBoundingClientRect();
        App.confetti(rect.left + rect.width / 2, rect.top + 40, 40);
        done && done();
      } }],
    });
    const f = $('form', m.body);
    const upd = () => {
      const n = $$('input[name="task_ids[]"]:checked', f).length;
      const left = mine.length - Object.keys(assigned).filter((k) => l.task_ids.includes(+k)).length;
      $('[data-count]', m.body).textContent = left ? `${n} iş atanacak.` : 'Bu mekandaki tüm işler zaten atanmış. Değiştirmek için İş Atamaları ekranını kullanın.';
    };
    f.addEventListener('change', upd); upd();
  }

  /* =========================================================
     Gelen bildirimler (karekodla dış kullanıcılardan)
     ========================================================= */
  const CAT_EMOJI = { clean: '🧹', supply: '🧻', broken: '🔧', climate: '🌡️', other: '💬' };
  const REP_STATUS = { new: ['Yeni', 'missed'], progress: ['İşlemde', 'overdue'], done: ['Çözüldü', 'done'] };

  async function viewInbox(v) {
    let filter = sessionStorage.getItem('istakip.inbox') || 'open';
    v.innerHTML = head('Gelen Bildirimler', 'Odalardaki karekodlarla kurum çalışanlarının bildirdiği sorunlar', `
      <a class="btn" href="#/mekanlar">${icon('qr')}<span>Karekodlar</span></a>
      <button class="btn icon" data-refresh title="Yenile">${icon('refresh')}</button>`) + `<div data-box>${skel(4, 90)}</div>`;
    const box = $('[data-box]', v);
    let data;
    async function load() {
      try { data = await api('reports'); render(); refreshInbox(); } catch (e) { App.err(e); }
    }
    $('[data-refresh]', v).onclick = load;

    function render() {
      const c = data.counts;
      const items = data.items.filter((r) => filter === 'all' ? true : filter === 'open' ? r.status !== 'done' : r.status === filter);
      const chip = (k, l, n) => `<button class="chip ${filter === k ? 'active' : ''}" data-chip="${k}">${l}<span class="n">${n}</span></button>`;
      let html = `<div class="chips" style="margin-bottom:12px">${chip('open', 'Açık', c.new + c.progress)}${chip('new', 'Yeni', c.new)}${chip('progress', 'İşlemde', c.progress)}${chip('done', 'Çözüldü', c.done)}${chip('all', 'Tümü', c.new + c.progress + c.done)}</div>`;
      if (!items.length) {
        html += `<div class="glass">${emptyBox(filter === 'done' ? '📭' : '✨', filter === 'done' ? 'Çözülmüş bildirim yok' : 'Açık bildirim yok',
          'Mekanlar ekranından karekodları yazdırıp odalara asın; kurum çalışanları sorunları buradan bildirsin.',
          `<a class="btn primary" href="#/mekanlar">${icon('qr')}<span>Karekodları hazırla</span></a>`)}</div>`;
      } else {
        html += '<div class="inbox stagger">' + items.map((r) => {
          const [sl, sc] = REP_STATUS[r.status] || REP_STATUS.new;
          return `<article class="glass inbox-item lift st-${r.status}" data-id="${r.id}">
            <div class="inbox-emoji">${CAT_EMOJI[r.category] || '💬'}</div>
            <div class="inbox-main">
              <div class="inbox-top"><b>${h(r.category_label)}</b><span class="tag">${icon('pin')}${h(r.location || 'Silinmiş mekan')}</span>
                <span class="badge ${sc}">${sl}</span><span class="muted small nowrap">${h(App.relDay(r.created_at))} ${h(App.fmtTime(r.created_at))}</span></div>
              <p class="inbox-desc">${h(r.description)}</p>
              ${r.photo ? `<img class="inbox-photo" src="${h(App.reportPhotoUrl(r.id))}" alt="Bildirim fotoğrafı" loading="lazy" data-photo="${r.id}">` : ''}
              <div class="sub small muted">${r.reporter_name || r.reporter_contact ? `${icon('user')} ${h([r.reporter_name, r.reporter_contact].filter(Boolean).join(' · '))}` : 'İsim bırakılmadı'}</div>
              ${r.status !== 'new' && r.handled_name ? `<div class="inbox-note">${r.status === 'done' ? '✅' : '⏳'} <b>${h(r.handled_name)}</b> · ${h(App.relDay(r.handled_at))} ${h(App.fmtTime(r.handled_at))}${r.admin_note ? ' — ' + h(r.admin_note) : ''}</div>` : ''}
            </div>
            <div class="inbox-actions">
              ${r.status === 'new' ? `<button class="btn sm" data-st="progress">${icon('clock')}<span>İşleme al</span></button>` : ''}
              ${r.status !== 'done' ? `<button class="btn sm success" data-st="done">${icon('check')}<span>Çözüldü</span></button>` : `<button class="btn sm ghost" data-st="new">${icon('refresh')}<span>Yeniden aç</span></button>`}
              <button class="btn icon sm ghost danger" data-del title="Sil">${icon('trash')}</button></div></article>`;
        }).join('') + '</div>';
      }
      box.innerHTML = html;
      $$('[data-chip]', box).forEach((b) => (b.onclick = () => { filter = b.dataset.chip; sessionStorage.setItem('istakip.inbox', filter); render(); }));
      $$('[data-photo]', box).forEach((img) => (img.onclick = () => App.modal({ title: 'Fotoğraf', wide: true, body: `<img class="photo-thumb" src="${h(img.src)}" alt="">` })));
      $$('.inbox-item', box).forEach((el) => {
        const r = data.items.find((x) => x.id == el.dataset.id);
        $$('[data-st]', el).forEach((b) => (b.onclick = () => setStatus(r, b.dataset.st, b)));
        $('[data-del]', el).onclick = async () => {
          if (!(await App.confirm('Bildirim kalıcı olarak silinecek.', { ok: 'Sil' }))) return;
          try { await api('report_delete', { id: r.id }); App.toast('Silindi'); load(); } catch (e) { App.err(e); }
        };
      });
    }

    function setStatus(r, st, btn) {
      if (st === 'done') {
        App.modal({
          title: 'Çözüldü olarak işaretle',
          body: `<p class="muted">${h(r.location || '')} · ${h(r.description)}</p><br>
            <label class="field"><span>Yapılan işlem (isteğe bağlı)</span><textarea name="note" rows="3" placeholder="Örn. kağıt havlu yenilendi">${h(r.admin_note || '')}</textarea></label>`,
          actions: [{ label: 'Vazgeç', cls: 'ghost' }, { label: 'Çözüldü', cls: 'success', icon: 'check', onClick: async (m) => {
            await api('report_update', { id: r.id, status: 'done', admin_note: $('textarea', m.body).value });
            const rect = btn.getBoundingClientRect();
            App.confetti(rect.left + rect.width / 2, rect.top, 30);
            App.toast('Bildirim çözüldü');
            load();
          } }],
        });
        return;
      }
      api('report_update', { id: r.id, status: st, admin_note: r.admin_note || '' })
        .then(() => { App.toast(st === 'progress' ? 'İşleme alındı' : 'Bildirim yeniden açıldı', 'info'); load(); })
        .catch(App.err);
    }

    await load();
    timer = setInterval(() => { if (!document.hidden && !document.querySelector('.modal-back')) load(); }, 60000);
  }

  /* ---------- karekodlar ---------- */
  const reportUrl = (l) => App.reportUrl(l.qr_token);

  function qrPoster(l) {
    return `<article class="qr-poster">
      <img class="qr-logo" src="${h(App.ANTET)}" alt="Yükseköğretim Kalite Kurulu">
      <h2>Bir sorun mu var?</h2>
      <p>Karekodu telefonunuzun kamerasıyla okutun,<br>sorunu bize hemen bildirin.</p>
      <div class="qr-code">${App.qrSvg(reportUrl(l))}</div>
      <div class="qr-loc">${h(l.name)}</div>
      <small class="qr-url">${h(reportUrl(l))}</small></article>`;
  }

  function qrModal(l) {
    const m = App.modal({
      title: l.name + ' · Sorun bildirme karekodu',
      body: `<div class="qr-single"><div class="qr-code big">${App.qrSvg(reportUrl(l))}</div>
        <div class="grid" style="gap:10px;align-content:start">
          <p class="muted small">Bu karekodu okutan kişi giriş yapmadan <b>${h(l.name)}</b> için sorun bildirebilir. Bildirimler <b>Gelen Bildirimler</b> ekranına düşer.</p>
          <label class="field"><span>Bağlantı</span><input readonly value="${h(reportUrl(l))}" data-url></label>
          <div class="toolbar"><button class="btn sm" type="button" data-copy>${icon('doc')}<span>Kopyala</span></button>
            <a class="btn sm" href="${h(reportUrl(l))}" target="_blank" rel="noopener">${icon('chev')}<span>Sayfayı aç</span></a></div>
          <button class="btn sm ghost danger" type="button" data-reset>${icon('refresh')}<span>Karekodu yenile</span></button>
          <p class="muted small">Yenilerseniz eski karekod çalışmaz; yenisini yazdırıp asmanız gerekir.</p></div></div>`,
      actions: [{ label: 'Kapat', cls: 'ghost' }, { label: 'Afiş yazdır', cls: 'primary', icon: 'printer', onClick: () => { printDoc(`<div class="qr-sheet one">${qrPoster(l)}</div>`); return false; } }],
    });
    $('[data-copy]', m.body).onclick = async () => {
      try { await navigator.clipboard.writeText(reportUrl(l)); App.toast('Bağlantı kopyalandı'); } catch (e) { $('[data-url]', m.body).select(); }
    };
    $('[data-reset]', m.body).onclick = async () => {
      if (!(await App.confirm('Bu mekanın karekodu yenilenecek. Asılı olan eski karekod çalışmayacak.', { ok: 'Yenile' }))) return;
      try { await api('location_qr_reset', { id: l.id }); invalidate('locations'); m.close(); App.toast('Karekod yenilendi; yenisini yazdırın'); route(); } catch (e) { App.err(e); }
    };
  }

  function qrPrintModal(locs) {
    App.modal({
      title: 'Karekodları yazdır', wide: true,
      body: `<form class="form">
        <div class="field"><span>Mekanlar</span>
          <div class="pick-tools"><button type="button" class="btn sm ghost" data-all>Tümünü seç</button><button type="button" class="btn sm ghost" data-none>Temizle</button></div>
          <div class="pick-items">${locs.map((l) => `<label><input type="checkbox" name="ids[]" value="${l.id}" checked><span>${h(l.name)}</span></label>`).join('')}</div></div>
        <div class="field"><span>Yerleşim</span><div class="seg">
          <label><input type="radio" name="layout" value="one" checked><span>Sayfa başına 1 (A4 afiş)</span></label>
          <label><input type="radio" name="layout" value="four"><span>Sayfa başına 4 (kapı etiketi)</span></label></div></div>
        <p class="muted small">Her afişte YÖKAK logosu, mekan adı ve o mekana özel karekod bulunur.</p></form>`,
      actions: [{ label: 'Vazgeç', cls: 'ghost' }, { label: 'Yazdır', cls: 'primary', icon: 'printer', onClick: (m) => {
        const f = $('form', m.body);
        const ids = $$('input[name="ids[]"]:checked', f).map((i) => +i.value);
        if (!ids.length) throw new Error('En az bir mekan seçin.');
        const layout = f.querySelector('input[name=layout]:checked').value;
        const sel = locs.filter((l) => ids.includes(+l.id));
        const pages = [];
        for (let i = 0; i < sel.length; i += 4) pages.push(sel.slice(i, i + 4));
        printDoc(layout === 'four'
          ? `<div class="qr-sheet four">${pages.map((p) => `<div class="qr-page">${p.map(qrPoster).join('')}</div>`).join('')}</div>`
          : `<div class="qr-sheet one">${sel.map(qrPoster).join('')}</div>`);
        return false;
      } }],
      onOpen: (m) => {
        $('[data-all]', m.body).onclick = () => $$('input[name="ids[]"]', m.body).forEach((i) => (i.checked = true));
        $('[data-none]', m.body).onclick = () => $$('input[name="ids[]"]', m.body).forEach((i) => (i.checked = false));
      },
    });
  }

  async function viewLocations(v) {
    let mode = sessionStorage.getItem('istakip.locview') || 'list';
    v.innerHTML = head('Mekanlar', 'İşlerin yapıldığı yerler ve her mekanda yapılacak işler', `
      <div class="seg" role="radiogroup"><label><input type="radio" name="lv" value="list" ${mode === 'list' ? 'checked' : ''}><span>Liste</span></label>
        <label><input type="radio" name="lv" value="matrix" ${mode === 'matrix' ? 'checked' : ''}><span>Mekan × İş tablosu</span></label></div>
      <button class="btn" data-qrall>${icon('qr')}<span>Karekodları yazdır</span></button>
      <button class="btn primary" data-new>${icon('plus')}<span>Yeni mekan</span></button>`) + `<div class="glass card" data-box>${skel(6)}</div>`;
    const [locs, tasks] = await Promise.all([get('locations', true), get('tasks', true)]);
    $('[data-qrall]', v).onclick = () => qrPrintModal(locs);
    const taskName = Object.fromEntries(tasks.map((t) => [t.id, t.name]));
    $('[data-new]', v).onclick = () => locationModal(null, locs.length, route);
    $$('input[name=lv]', v).forEach((r) => (r.onchange = () => { mode = r.value; sessionStorage.setItem('istakip.locview', mode); render(); }));
    const box = $('[data-box]', v);

    function renderList() {
      if (!locs.length) { box.innerHTML = emptyBox('📍', 'Henüz mekan yok', 'İşlerin yapılacağı yerleri ekleyin.'); return; }
      box.innerHTML = '<div class="list">' + locs.map((l, i) => {
        const names = l.task_ids.map((id) => taskName[id]).filter(Boolean);
        const shown = names.slice(0, 5);
        return `<div class="row">
        <span class="avatar" style="--c1:#ec4899;--c2:#f59e0b;width:32px;height:32px">${icon('pin')}</span>
        <div><div class="title">${h(l.name)}</div><div class="sub">${l.description ? `<span>${h(l.description)}</span>` : ''}<span>${names.length} tanımlı iş</span><span>${l.plan_count} aktif atama</span></div>
          <div class="loc-chips">${shown.map((n) => `<span class="lchip">${h(n)}</span>`).join('')}${names.length > 5 ? `<span class="lchip more">+${names.length - 5}</span>` : ''}${!names.length ? '<span class="lchip none">İş tanımlanmamış</span>' : ''}</div></div>
        <div class="actions">
          <button class="btn sm" data-assign="${l.id}" title="Bu mekanın işlerini personele ata">${icon('play')}<span>İşleri ata</span></button>
          <button class="btn icon sm ghost" data-qr="${l.id}" title="Sorun bildirme karekodu">${icon('qr')}</button>
          <button class="btn icon sm ghost" data-up="${i}" ${i === 0 ? 'disabled' : ''} title="Yukarı"><svg class="ico" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
          <button class="btn icon sm ghost" data-down="${i}" ${i === locs.length - 1 ? 'disabled' : ''} title="Aşağı"><svg class="ico" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
          <button class="btn icon sm ghost" data-edit="${l.id}" title="Düzenle">${icon('edit')}</button>
          <button class="btn icon sm ghost danger" data-del="${l.id}" title="Sil">${icon('trash')}</button></div></div>`;
      }).join('') + '</div>';
      const move = async (i, d) => {
        const ids = locs.map((l) => l.id);
        [ids[i], ids[i + d]] = [ids[i + d], ids[i]];
        try { await api('locations_order', { ids }); invalidate('locations'); route(); } catch (e) { App.err(e); }
      };
      $$('[data-assign]', box).forEach((b) => (b.onclick = () => locationAssignModal(locs.find((l) => l.id == b.dataset.assign), route)));
      $$('[data-qr]', box).forEach((b) => (b.onclick = () => qrModal(locs.find((l) => l.id == b.dataset.qr))));
      $$('[data-up]', box).forEach((b) => (b.onclick = () => move(+b.dataset.up, -1)));
      $$('[data-down]', box).forEach((b) => (b.onclick = () => move(+b.dataset.down, 1)));
      $$('[data-edit]', box).forEach((b) => (b.onclick = () => locationModal(locs.find((l) => l.id == b.dataset.edit), locs.length, route)));
      $$('[data-del]', box).forEach((b) => (b.onclick = async () => {
        if (!(await App.confirm('Mekan silinecek.', { ok: 'Sil' }))) return;
        try { await api('location_delete', { id: b.dataset.del }); invalidate('locations'); App.toast('Silindi'); route(); } catch (e) { App.err(e); }
      }));
    }

    function renderMatrix() {
      if (!locs.length || !tasks.length) { box.innerHTML = emptyBox('🧩', 'Tablo için mekan ve iş tanımı gerekli', ''); return; }
      const has = new Set();
      locs.forEach((l) => l.task_ids.forEach((t) => has.add(l.id + '|' + t)));
      const colCount = (l) => l.task_ids.length;
      const rowCount = (t) => locs.filter((l) => has.has(l.id + '|' + t.id)).length;
      box.innerHTML = `<div class="toolbar" style="margin-bottom:10px"><input type="search" placeholder="İş ara" data-q style="max-width:240px">
          <span class="muted small">Hücreye tıklayarak işin o mekanda yapılıp yapılmadığını belirleyin.</span></div>
        <div class="matrix-wrap"><table class="matrix"><thead><tr><th class="corner">İş \\ Mekan</th>
          ${locs.map((l) => `<th class="lh"><span>${h(l.name)}</span><small data-cc="${l.id}">${colCount(l)}</small></th>`).join('')}</tr></thead>
        <tbody>${tasks.map((t) => `<tr data-name="${h(t.name.toLocaleLowerCase('tr'))}"><th class="th"><b>${h(t.name)}</b><small>${h(t.freq)} · <span data-rc="${t.id}">${rowCount(t)}</span> mekan</small></th>
          ${locs.map((l) => `<td><button type="button" class="cell ${has.has(l.id + '|' + t.id) ? 'on' : ''}" data-l="${l.id}" data-t="${t.id}" title="${h(t.name)} · ${h(l.name)}" aria-pressed="${has.has(l.id + '|' + t.id)}">
            <svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button></td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
      $('[data-q]', box).oninput = (e) => { const q = e.target.value.toLocaleLowerCase('tr'); $$('tbody tr', box).forEach((r) => (r.hidden = !r.dataset.name.includes(q))); };
      box.querySelector('tbody').addEventListener('click', async (e) => {
        const c = e.target.closest('.cell');
        if (!c || c.disabled) return;
        const on = !c.classList.contains('on');
        const l = locs.find((x) => x.id == c.dataset.l);
        const tid = +c.dataset.t;
        c.classList.toggle('on', on); c.setAttribute('aria-pressed', on); c.disabled = true;
        try {
          await api('location_task_toggle', { location_id: l.id, task_id: tid, on: on ? 1 : 0 });
          if (on) l.task_ids.push(tid); else l.task_ids = l.task_ids.filter((x) => x !== tid);
          $(`[data-cc="${l.id}"]`, box).textContent = l.task_ids.length;
          $(`[data-rc="${tid}"]`, box).textContent = locs.filter((x) => x.task_ids.includes(tid)).length;
          invalidate('tasks', 'locations');
        } catch (err) { c.classList.toggle('on', !on); App.err(err); }
        c.disabled = false;
      });
    }

    function render() { if (mode === 'matrix') renderMatrix(); else renderList(); }
    render();
  }

  /* =========================================================
     Personel

  /* ---------- görev tebliğ belgesi ---------- */
  const DOC_DEFAULTS = {
    doc_header: 'T.C.\nYÜKSEKÖĞRETİM KALİTE KURULU\n' + (BOOT.company || 'Destek Hizmetleri'),
    doc_subject: 'Görev Tebliği',
    doc_intro: '{tarih} tarihinden itibaren aşağıda belirtilen mekanlarda, belirtilen sıklık ve saatlerde yapılacak işler tarafınıza görev olarak verilmiştir.\n\nGörevlerinizi eksiksiz ve zamanında yerine getirmeniz, yaptığınız işleri İş Takip uygulaması üzerinden işaretlemeniz gerekmektedir.\n\nBilgilerinizi ve gereğini rica ederim.',
    doc_signer_name: '',
    doc_signer_title: 'Destek Hizmetleri Sorumlusu',
    doc_staff_title: 'Destek Personeli',
    doc_print_header: '1',
  };
  const trDate = (ymd) => (ymd ? ymd.slice(8, 10) + '.' + ymd.slice(5, 7) + '.' + ymd.slice(0, 4) : '');
  const nl2br = (s) => h(s).replace(/\n/g, '<br>');

  function docHtml(u, plans, f) {
    const groups = new Map();
    plans.forEach((p) => { if (!groups.has(p.location_name)) groups.set(p.location_name, []); groups.get(p.location_name).push(p); });
    let n = 0;
    const rows = [...groups].map(([loc, list]) => `<tr class="doc-loc"><td colspan="4">${h(loc)}</td></tr>` + list.map((p) => `<tr>
      <td class="c">${++n}</td>
      <td><b>${h(p.task_name)}</b>${f.desc && p.task_desc ? `<div class="doc-desc">${h(p.task_desc)}</div>` : ''}${f.desc && p.note ? `<div class="doc-desc">Not: ${h(p.note)}</div>` : ''}${p.user_id ? '' : '<div class="doc-desc">Ortak iş</div>'}</td>
      <td>${h(p.freq)}${p.start_date > f.date ? `<div class="doc-desc">${h(trDate(p.start_date))} itibarıyla</div>` : ''}${p.end_date ? `<div class="doc-desc">${h(trDate(p.end_date))} tarihine kadar</div>` : ''}</td>
      <td class="c">${h((p.times ? p.times.split(',').join(', ') : p.due_time) || '—')}</td></tr>`).join('')).join('');
    const intro = h(f.intro).replace(/\{tarih\}/g, h(trDate(f.date))).replace(/\{ad\}/g, h(u.name)).replace(/\n/g, '<br>');
    const sign = (t, name, title, extra) => `<div class="doc-sign"><b class="doc-sign-h">${t}</b>${extra || ''}
      <div class="doc-line"><span>Adı Soyadı</span><b>${h(name || '')}</b></div>
      <div class="doc-line"><span>Unvanı</span><b>${h(title || '')}</b></div>
      <div class="doc-line"><span>Tarih</span><b>${'.... / .... / ' + f.date.slice(0, 4)}</b></div>
      <div class="doc-line sig"><span>İmza</span><b></b></div></div>`;
    return `<article class="doc-page${f.header ? '' : ' no-head'}">
      ${f.header ? `<header class="doc-head"><img class="doc-logo" src="${h(App.ANTET)}" alt="Yükseköğretim Kalite Kurulu"><div class="doc-org">${nl2br(f.headerText)}</div></header>` : '<div class="doc-head-space"></div>'}
      <div class="doc-meta"><div><span>Sayı</span>: ${h(f.no || '')}</div><div class="r">${h(trDate(f.date))}</div></div>
      <div class="doc-meta"><div><span>Konu</span>: ${h(f.subject)}</div></div>
      <p class="doc-to">Sayın ${h(u.name)}</p>
      <div class="doc-body">${intro}</div>
      ${plans.length ? `<table class="doc-table"><colgroup><col style="width:9mm"><col><col style="width:38mm"><col style="width:34mm"></colgroup><thead><tr><th class="c">No</th><th>Görev / İş</th><th>Sıklık</th><th class="c">Saat</th></tr></thead><tbody>${rows}</tbody></table>`
        : '<p class="doc-body"><i>Bu personele atanmış aktif iş bulunmamaktadır.</i></p>'}
      ${f.extra ? `<div class="doc-body">${nl2br(f.extra)}</div>` : ''}
      <div class="doc-signs">
        ${sign('TEBLİĞ EDEN', f.signerName, f.signerTitle, '<p class="doc-ack">&nbsp;</p>')}
        ${sign('TEBELLÜĞ EDEN', u.name, f.staffTitle, '<p class="doc-ack">Yukarıda belirtilen görevleri tebellüğ ettim.</p>')}
      </div></article>`;
  }

  function printDoc(html) {
    document.getElementById('print-root')?.remove();
    const root = App.el(`<div id="print-root">${html}</div>`);
    document.body.appendChild(root);
    document.body.classList.add('printing');
    const done = () => { document.body.classList.remove('printing'); root.remove(); window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done);
    setTimeout(() => { try { window.print(); } catch (e) { App.toast('Tarayıcı yazdırmaya izin vermedi', 'bad'); } setTimeout(() => { if (!window.matchMedia('print').matches) done(); }, 1500); }, 50);
  }

  async function docModal(u) {
    const [s, all] = await Promise.all([api('settings'), api('plans')]);
    const val = (k) => (s[k] != null && s[k] !== '' ? s[k] : DOC_DEFAULTS[k]);
    const cmp = (x, y) => String(x).localeCompare(String(y), 'tr');
    const sortPlans = (list) => list.sort((a, b) => (+a.location_sort - +b.location_sort) || cmp(a.location_name, b.location_name)
      || cmp(a.due_time || '99', b.due_time || '99') || cmp(a.task_name, b.task_name));
    const m = App.modal({
      title: u.name + ' · Görev tebliğ belgesi', wide: true,
      body: `<div class="doc-editor"><form class="form doc-form" autocomplete="off">
        <div class="grid2"><label class="field"><span>Belge tarihi</span><input type="date" name="date" value="${App.today()}"></label>
          <label class="field"><span>Sayı</span><input name="no" placeholder="Örn. E-12345678-000-1234"></label></div>
        <label class="field"><span>Konu</span><input name="subject" value="${h(val('doc_subject'))}"></label>
        <label class="check"><input type="checkbox" name="header" ${val('doc_print_header') === '1' ? 'checked' : ''}><span></span>Antet ve logoyu yazdır (hazır antetli kağıda basarken kapatın)</label>
        <label class="field" data-headtext><span>Antet satırları</span><textarea name="headerText" rows="3">${h(val('doc_header'))}</textarea></label>
        <label class="field"><span>Metin <small>· {tarih} ve {ad} otomatik doldurulur</small></span><textarea name="intro" rows="6">${h(val('doc_intro'))}</textarea></label>
        <label class="field"><span>Ek açıklama (isteğe bağlı, tablonun altına)</span><textarea name="extra" rows="2"></textarea></label>
        <div class="grid2"><label class="field"><span>Tebliğ eden ad soyad</span><input name="signerName" value="${h(val('doc_signer_name') || me.name)}"></label>
          <label class="field"><span>Tebliğ eden unvan</span><input name="signerTitle" value="${h(val('doc_signer_title'))}"></label></div>
        <label class="field"><span>Personelin unvanı</span><input name="staffTitle" value="${h(val('doc_staff_title'))}"></label>
        <label class="check"><input type="checkbox" name="desc" checked><span></span>İş açıklamalarını ve notları göster</label>
        <label class="check"><input type="checkbox" name="shared"><span></span>Ortak (herkesin yapabileceği) işleri de ekle</label>
        <label class="check"><input type="checkbox" name="remember"><span></span>Antet, metin ve imza bilgilerini sonraki belgeler için hatırla</label>
      </form>
      <div class="doc-preview-wrap"><div class="doc-preview-label muted small">Önizleme · A4</div><div class="doc-preview"><div class="doc-scale"></div></div></div></div>`,
      actions: [{ label: 'Kapat', cls: 'ghost' }, { label: 'Yazdır', cls: 'primary', icon: 'printer', onClick: async (mm) => {
        const f = read();
        if (f.remember) {
          await api('doc_settings_save', { doc_header: f.headerText, doc_intro: f.intro, doc_signer_name: f.signerName, doc_signer_title: f.signerTitle,
            doc_staff_title: f.staffTitle, doc_subject: f.subject, doc_print_header: f.header ? '1' : '0' });
        }
        printDoc(docHtml(u, plansFor(f), f));
        return false;
      } }],
    });
    const form = $('form', m.body);
    const read = () => {
      const o = App.formData(form);
      ['header', 'desc', 'shared', 'remember'].forEach((k) => { o[k] = form[k].checked; });
      if (!o.date) o.date = App.today();
      return o;
    };
    const plansFor = (f) => sortPlans(all.filter((p) => p.user_id == u.id || (f.shared && !p.user_id)).filter((p) => !p.end_date || p.end_date >= f.date));
    const scale = $('.doc-scale', m.body);
    const draw = () => {
      if (!m.root.isConnected) { window.removeEventListener('resize', draw); return; }
      const f = read();
      $('[data-headtext]', m.body).style.display = f.header ? '' : 'none';
      scale.innerHTML = docHtml(u, plansFor(f), f);
      const box = $('.doc-preview', m.body);
      const k = box.clientWidth / scale.firstElementChild.offsetWidth;
      scale.style.transform = `scale(${k})`;
      box.style.height = scale.firstElementChild.offsetHeight * k + 'px';
    };
    let t;
    form.addEventListener('input', () => { clearTimeout(t); t = setTimeout(draw, 120); });
    form.addEventListener('change', draw);
    requestAnimationFrame(draw);
    window.addEventListener('resize', draw, { passive: true });
  }
