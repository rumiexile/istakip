    if (!t) return;
    const r = t.getBoundingClientRect();
    t.style.setProperty('--mx', e.clientX - r.left + 'px');
    t.style.setProperty('--my', e.clientY - r.top + 'px');
  }, { passive: true });

  // 3B eğim
  if (fine && !reduce) {
    document.addEventListener('pointermove', (e) => {
      const t = e.target.closest && e.target.closest('[data-tilt]');
      if (!t) return;
      const r = t.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - 0.5;
      const y = (e.clientY - r.top) / r.height - 0.5;
      const k = parseFloat(t.dataset.tilt) || 6;
      t.style.transform = `perspective(900px) rotateX(${(-y * k).toFixed(2)}deg) rotateY(${(x * k).toFixed(2)}deg) translateZ(0)`;
    }, { passive: true });
    document.addEventListener('pointerout', (e) => {
      const t = e.target.closest && e.target.closest('[data-tilt]');
      if (t && !t.contains(e.relatedTarget)) t.style.transform = '';
    });
  }

  // Dalgalanma
  document.addEventListener('pointerdown', (e) => {
    const b = e.target.closest && e.target.closest('.btn, .chip, .tick');
    if (!b || reduce) return;
    const r = b.getBoundingClientRect();
    const size = Math.max(r.width, r.height) * 2.2;
    const s = document.createElement('span');
    s.className = 'ripple';
    s.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX - r.left - size / 2}px;top:${e.clientY - r.top - size / 2}px`;
    b.appendChild(s);
    setTimeout(() => s.remove(), 700);
  });

  App.confetti = (x, y, n) => {
    if (reduce) return;
    const colors = ['#6366f1', '#ec4899', '#06b6d4', '#10b981', '#f59e0b', '#8b5cf6'];
    n = n || 26;
    for (let i = 0; i < n; i++) {
      const c = document.createElement('i');
      c.className = 'confetti';
      c.style.background = colors[i % colors.length];
      document.body.appendChild(c);
      const ang = Math.random() * Math.PI * 2;
      const v = 60 + Math.random() * 140;
      const dx = Math.cos(ang) * v, dy = Math.sin(ang) * v - 80;
      const rot = Math.random() * 720 - 360;
      c.animate([
        { transform: `translate(${x}px, ${y}px) rotate(0) scale(1)`, opacity: 1 },
        { transform: `translate(${x + dx}px, ${y + dy}px) rotate(${rot / 2}deg) scale(1)`, opacity: 1, offset: 0.45 },
        { transform: `translate(${x + dx * 1.3}px, ${y + dy + 180}px) rotate(${rot}deg) scale(.6)`, opacity: 0 },
      ], { duration: 1100 + Math.random() * 500, easing: 'cubic-bezier(.22,1,.36,1)' }).onfinish = () => c.remove();
    }
  };

  App.countUp = (el, to, dur) => {
    if (!el) return;
    const from = parseInt(el.dataset.v || '0', 10) || 0;
    el.dataset.v = to;
    if (reduce || from === to) { el.textContent = to; return; }
    const start = performance.now(); dur = dur || 900;
    const step = (t) => {
      const p = Math.min(1, (t - start) / dur);
      const e = 1 - Math.pow(1 - p, 4);
      el.textContent = Math.round(from + (to - from) * e);
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  };

  App.ring = (pct, size, label, sub) => {
    size = size || 120;
    const sw = Math.max(8, size / 11), r = (size - sw) / 2, c = 2 * Math.PI * r;
    const html = `<div class="ring" style="width:${size}px;height:${size}px" data-pct="${pct}">
      <svg width="${size}" height="${size}"><defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#6366f1"/><stop offset=".55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#06b6d4"/></linearGradient></defs>
        <circle class="track" cx="${size / 2}" cy="${size / 2}" r="${r}" stroke-width="${sw}"/>
        <circle class="bar" cx="${size / 2}" cy="${size / 2}" r="${r}" stroke-width="${sw}" stroke-dasharray="${c}" stroke-dashoffset="${c}"/></svg>
      <div class="label"><b>${label === undefined ? '%' : ''}<span class="rn">0</span></b><small>${App.h(sub || '')}</small></div></div>`;
    return html;
  };
  App.animateRings = (root) => {
    App.$$('.ring', root).forEach((rg) => {
      const bar = rg.querySelector('.bar');
      const c = parseFloat(bar.getAttribute('stroke-dasharray'));
      const pct = Math.max(0, Math.min(100, +rg.dataset.pct || 0));
      requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.strokeDashoffset = c * (1 - pct / 100); }));
      App.countUp(rg.querySelector('.rn'), Math.round(pct));
    });
  };
  App.animateBars = (root) => {
    requestAnimationFrame(() => requestAnimationFrame(() => {
      App.$$('.track-h i[data-w]', root).forEach((i) => { i.style.width = i.dataset.w + '%'; });
    }));
  };

  /* ---------- bildirim ---------- */
  let toastBox;
  App.toast = (msg, type, opts) => {
    opts = opts || {};
    if (!toastBox) { toastBox = App.el('<div class="toasts" role="status" aria-live="polite"></div>'); document.body.appendChild(toastBox); }
    const ic = type === 'bad' ? P.x : type === 'info' ? P.sparkle : P.check;
    const t = App.el(`<div class="toast glass ${type || ''}"><span class="tdot"><svg viewBox="0 0 24 24">${ic}</svg></span><span>${App.h(msg)}</span></div>`);
    if (opts.action) {
      const b = App.el(`<button class="btn sm">${App.h(opts.action)}</button>`);
      b.onclick = () => { opts.onAction && opts.onAction(); close(); };
      t.appendChild(b);
    }
    toastBox.appendChild(t);
    const close = () => { t.classList.add('out'); setTimeout(() => t.remove(), 350); };
    setTimeout(close, opts.duration || (opts.action ? 5000 : 2800));
    return close;
  };
  App.err = (e) => App.toast(e && e.message ? e.message : String(e), 'bad');

  /* ---------- modal ---------- */
  App.modal = ({ title, body, actions, wide, onOpen, onClose }) => {
    const back = App.el(`<div class="modal-back"><div class="modal glass ${wide ? 'wide' : ''}" role="dialog" aria-modal="true">
      <header><h3>${App.h(title || '')}</h3><button class="btn icon sm ghost" data-x aria-label="Kapat">${App.icon('x')}</button></header>
      <div class="body"></div><footer></footer></div></div>`);
    const bodyEl = back.querySelector('.body');
    if (typeof body === 'string') bodyEl.innerHTML = body; else if (body) bodyEl.appendChild(body);
    const foot = back.querySelector('footer');
    const m = { root: back, body: bodyEl, closed: false };
    m.close = (val) => {
      if (m.closed) return; m.closed = true;
      back.classList.add('closing');
      document.removeEventListener('keydown', onKey);
      setTimeout(() => back.remove(), 260);
      onClose && onClose(val);
    };
    (actions || []).forEach((a) => {
      const b = App.el(`<button class="btn ${a.cls || ''}" type="button">${a.icon ? App.icon(a.icon) : ''}<span>${App.h(a.label)}</span></button>`);
      b.onclick = async () => {
        if (!a.onClick) return m.close();
        b.classList.add('loading'); b.disabled = true;
        try { const r = await a.onClick(m, b); if (r !== false) m.close(r); } catch (e) { App.err(e); bodyEl.closest('.modal').classList.add('shake'); setTimeout(() => bodyEl.closest('.modal').classList.remove('shake'), 500); } finally { b.classList.remove('loading'); b.disabled = false; }
      };
      foot.appendChild(b);
    });
    if (!foot.children.length) foot.remove();
    const onKey = (e) => { if (e.key === 'Escape') m.close(); };
    document.addEventListener('keydown', onKey);
    back.addEventListener('pointerdown', (e) => { if (e.target === back) m.close(); });
    back.querySelector('[data-x]').onclick = () => m.close();
    document.body.appendChild(back);
    const first = bodyEl.querySelector('input:not([type=hidden]):not([type=checkbox]):not([type=radio]), select, textarea');
    if (first && window.matchMedia('(hover: hover)').matches) setTimeout(() => first.focus(), 80);
    onOpen && onOpen(m);
    return m;
  };
  App.confirm = (msg, { ok = 'Evet', danger = true, title = 'Emin misiniz?' } = {}) => new Promise((resolve) => {
    let v = false;
    App.modal({
      title,
      body: `<p>${App.h(msg)}</p>`,
      actions: [
        { label: 'Vazgeç', cls: 'ghost' },
        { label: ok, cls: danger ? 'warn' : 'primary', onClick: () => { v = true; } },
      ],
      onClose: () => resolve(v),
    });
  });

  App.formData = (form) => {
    const o = {};
    new FormData(form).forEach((v, k) => {
      if (k.endsWith('[]')) { k = k.slice(0, -2); (o[k] = o[k] || []).push(v); } else o[k] = v;
    });
    return o;
  };

  /* ---------- sıklık editörü ---------- */
  App.freqFields = (v, prefix) => {
    v = v || {}; prefix = prefix || 'f' + Math.random().toString(36).slice(2, 7);
    const t = v.freq_type || 'daily';
    const wd = String(v.weekdays || '').split(',');
    const r = (val, lbl) => `<label><input type="radio" name="${prefix}_type" value="${val}" ${t === val ? 'checked' : ''}><span>${lbl}</span></label>`;
    const days = [1, 2, 3, 4, 5, 6, 7].map((d) => `<label><input type="checkbox" name="${prefix}_wd" value="${d}" ${wd.includes(String(d)) ? 'checked' : ''}><span>${App.DAY_SHORT[d]}</span></label>`).join('');
    return `<div class="freq" data-freq="${prefix}">
      <div class="seg">${r('daily', 'Her gün')}${r('every_n_days', 'X günde 1')}${r('weekly', 'Haftalık')}${r('monthly', 'Aylık')}</div>
      <div class="inline" data-show="every_n_days"><input type="number" min="2" max="365" name="${prefix}_n_days" value="${t === 'every_n_days' ? v.freq_interval || 2 : 2}"> iş gününde bir</div>
      <div data-show="weekly" class="freq">
        <div class="days">${days}</div>
        <div class="inline"><input type="number" min="1" max="52" name="${prefix}_n_weeks" value="${t === 'weekly' ? v.freq_interval || 1 : 1}"> haftada bir</div>
      </div>
      <div class="inline" data-show="monthly"><input type="number" min="1" max="12" name="${prefix}_n_months" value="${t === 'monthly' ? v.freq_interval || 1 : 1}"> ayda bir, ayın
        <input type="number" min="1" max="31" name="${prefix}_md" value="${v.month_day || 1}">. günü</div>
      <div class="inline">Hedef saat <input type="time" name="${prefix}_time" value="${App.h(v.due_time || '')}"><small class="muted">boş bırakılırsa gün sonuna kadar</small></div>
    </div>`;
  };
  App.bindFreq = (root) => {
    App.$$('[data-freq]', root).forEach((f) => {
      if (f.dataset.bound) return; f.dataset.bound = 1;
      const p = f.dataset.freq;
      const sync = () => {
        const t = (f.querySelector(`input[name=${p}_type]:checked`) || {}).value;
        App.$$(':scope > [data-show]', f).forEach((s) => { s.hidden = s.dataset.show !== t; });
      };
      f.addEventListener('change', sync); sync();
    });
  };
  App.readFreq = (f) => {
    const p = f.dataset.freq;
    const val = (n) => (f.querySelector(`[name=${p}_${n}]`) || {}).value;
    const t = f.querySelector(`input[name=${p}_type]:checked`).value;
    const o = { freq_type: t, freq_interval: 1, weekdays: null, month_day: null, due_time: val('time') || null };
    if (t === 'every_n_days') o.freq_interval = +val('n_days') || 2;
    if (t === 'weekly') { o.freq_interval = +val('n_weeks') || 1; o.weekdays = App.$$(`input[name=${p}_wd]:checked`, f).map((i) => i.value).join(','); }
    if (t === 'monthly') { o.freq_interval = +val('n_months') || 1; o.month_day = +val('md') || 1; }
    return o;
  };

  /* ---------- giriş ---------- */
  App.initLogin = () => {
    const f = document.getElementById('login-form');
    const alert = f.querySelector('.alert');
    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      const b = f.querySelector('button[type=submit]');
      b.classList.add('loading'); alert.hidden = true;
      try {
        await App.api('login', App.formData(f));
        App.confetti(innerWidth / 2, innerHeight / 2, 30);
        setTimeout(() => location.reload(), 350);
      } catch (err) {
        alert.textContent = err.message; alert.hidden = false;
        f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
        b.classList.remove('loading');
      }
    });
  };

  App.photoUrl = (c) => 'photo.php?id=' + c.id;
  App.download = (url) => { location.href = url; };

  App.logout = async () => {
    try { await App.api('logout', {}); } catch (e) { /* yoksay */ }
    location.href = 'index.php';
  };

  App.changePassword = () => {
    App.modal({
      title: 'Şifre değiştir',
      body: `<form class="form"><label class="field"><span>Mevcut şifre</span><input type="password" name="current" autocomplete="current-password"></label>
        <label class="field"><span>Yeni şifre</span><input type="password" name="new" autocomplete="new-password" minlength="6"></label></form>`,
      actions: [{ label: 'Vazgeç', cls: 'ghost' }, {
        label: 'Kaydet', cls: 'primary', onClick: async (m) => {
          await App.api('password', App.formData(m.body.querySelector('form')));
          App.toast('Şifreniz güncellendi');
        },
      }],
    });
  };

  /** Telefonda çekilen fotoğrafı yüklemeden önce küçültür. */
  App.shrinkImage = (file, max) => new Promise((resolve) => {
    max = max || 1400;
    if (!file || !/^image\//.test(file.type)) return resolve(file);
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob((b) => resolve(b ? new File([b], 'foto.jpg', { type: 'image/jpeg' }) : file), 'image/jpeg', 0.82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
})();

/* ---------- iş detay / işaretleme penceresi (personel ve yönetici ortak) ---------- */
(function () {
  'use strict';
  const { h, icon, badge } = App;

  App.canUndo = (it) => {
    const me = window.BOOT && BOOT.user;
    if (!it.completion || !me) return false;
    if (me.role === 'admin') return true;
    return it.completion.by_id === me.id && it.completion.at.slice(0, 10) === App.today();
  };

  App.completeItem = async (it, status, note, photo) => {
    const fd = new FormData();
    fd.append('plan_id', it.plan_id);
    fd.append('occ_date', it.occ_date);
    fd.append('status', status || 'done');
    if (note) fd.append('note', note);
    if (photo) fd.append('photo', photo, photo.name || 'foto.jpg');
    return App.api('complete', fd);
  };
  App.uncompleteItem = (it) => App.api('uncomplete', { plan_id: it.plan_id, occ_date: it.occ_date });

  App.taskSheet = (it, onChange) => {
    const c = it.completion;
    const isAdmin = BOOT.user.role === 'admin';
    const canMark = !c && it.status !== 'upcoming' && (it.status !== 'missed' || isAdmin);
    const carried = it.occ_date !== App.today();
    let body = `<div class="sheet-task">
      <div class="meta">${badge(it.status)}<span class="tag">${icon('pin')}${h(it.location)}</span>
        <span class="tag">${icon('refresh')}${h(it.freq)}</span>
        ${it.due_time ? `<span class="tag">${icon('clock')}${h(it.due_time)}</span>` : ''}
        ${carried ? `<span class="tag">${icon('calendar')}${h(App.fmtDate(it.occ_date, true))}</span>` : ''}
        ${it.user ? `<span class="tag">${icon('user')}${h(it.user)}</span>` : '<span class="tag">' + icon('users') + 'Ortak iş</span>'}</div>
      ${it.task_desc ? `<p class="muted">${h(it.task_desc)}</p>` : ''}
      ${it.note ? `<div class="alert info">${h(it.note)}</div>` : ''}
      ${it.status === 'leave' ? `<div class="alert leave">${h(it.user || 'Sorumlu')} bu gün izinli; iş “yapılmadı” sayılmaz. Yine de yapıldıysa işaretleyebilirsiniz.</div>` : ''}`;
    if (c) {
      body += `<div class="glass card" style="padding:14px">
        <div style="display:flex;gap:10px;align-items:center">${App.avatar(c.by || '?')}<div><b>${h(c.by || '')}</b>
        <div class="muted small">${h(App.relDay(c.at))} ${h(App.fmtTime(c.at))}${c.late ? ' · <span style="color:var(--warn);font-weight:700">geç yapıldı</span>' : ''}</div></div></div>
        ${c.note ? `<p style="margin-top:10px">${h(c.note)}</p>` : ''}
        ${c.photo ? `<img class="photo-thumb" src="${App.h(App.photoUrl(c))}" alt="Fotoğraf" loading="lazy">` : ''}</div>`;
    } else if (canMark) {
      body += `<label class="field"><span>Not (isteğe bağlı, sorun bildirirken zorunlu)</span><textarea name="note" placeholder="Örn. sabun bitti, depodan istendi"></textarea></label>
        <label class="photo-drop">${icon('camera')}<span>Fotoğraf ekle (isteğe bağlı)</span><input type="file" accept="image/*" capture="environment" hidden></label>
        <div class="big-actions"><button class="btn warn" data-act="issue">${icon('flag')}<span>Sorun var</span></button>
        <button class="btn success" data-act="done">${icon('check')}<span>Tamamlandı</span></button></div>`;
    } else if (it.status === 'missed') {
      body += `<div class="alert bad">Bu işin süresi geçti, yapılmadı olarak kaydedildi.</div>`;
    }
    body += '</div>';

    const actions = [];
    if (c && App.canUndo(it)) {
      actions.push({ label: 'İşareti geri al', cls: 'danger', icon: 'refresh', onClick: async () => {
        await App.uncompleteItem(it); App.toast('İşaret geri alındı', 'info'); onChange && onChange();
      } });
    }
    const m = App.modal({ title: it.task, body, actions });
    if (!canMark) return m;

    let photo = null;
    const drop = m.body.querySelector('.photo-drop');
    const input = drop.querySelector('input');
    input.onchange = async () => {
      if (!input.files[0]) return;
      photo = await App.shrinkImage(input.files[0]);
      const url = URL.createObjectURL(photo);
      drop.innerHTML = `<img src="${url}" alt=""><span>Değiştirmek için dokunun</span>`;
      drop.appendChild(input);
    };
    App.$$('[data-act]', m.body).forEach((b) => {
      b.onclick = async () => {
        const status = b.dataset.act;
        const note = m.body.querySelector('textarea').value.trim();
        if (status === 'issue' && !note) { App.toast('Lütfen sorunu kısaca yazın', 'bad'); m.body.querySelector('textarea').focus(); return; }
        b.classList.add('loading');
        try {
          const r = await App.completeItem(it, status, note, photo);
          const rect = b.getBoundingClientRect();
          if (status === 'done') App.confetti(rect.left + rect.width / 2, rect.top, 30);
          App.toast(status === 'done' ? 'Harika, iş tamamlandı!' : 'Sorun bildirildi', status === 'done' ? '' : 'info');
          m.close();
          onChange && onChange(r);
        } catch (e) { App.err(e); b.classList.remove('loading'); }
      };
    });
    return m;
  };
})();

</script>
<script>
window.__runAdmin = function () {

(function () {

    { id: 'panel', label: 'Günlük Durum', short: 'Durum', icon: 'home', view: viewDashboard },

    { id: 'ayarlar', label: 'Ayarlar', short: 'Ayarlar', icon: 'gear', view: viewSettings },

  let timer = null;
  const cache = {};
  async function get(name, force) {

    return cache[name];
  }
  function invalidate(...names) { names.forEach((n) => delete cache[n]); }

  /* ---------- iskelet ---------- */
  root.innerHTML = `<div class="shell">

      <div class="brand"><div class="brand-mark"><svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg></div>

      <nav class="nav"><span class="pill"></span>${ROUTES.map((r) => `<a href="#/${r.id}" data-r="${r.id}">${icon(r.icon)}<span>${r.label}</span></a>`).join('')}</nav>

          <button class="btn icon sm ghost" data-pw title="Şifre değiştir">${icon('key')}</button>
          <button class="btn icon sm ghost" data-out title="Çıkış">${icon('logout')}</button></div>
      </div></div></aside>
    <main class="main">
      <div class="topbar glass"><div class="brand-mark"><svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg></div>
        <b>${h(BOOT.company)}</b>
        <a class="btn icon sm" href="index.php?view=staff" title="Personel ekranı">${icon('phone')}</a>
        <button class="btn icon sm" data-out title="Çıkış">${icon('logout')}</button></div>

  </div>`;
  $$('[data-out]').forEach((b) => (b.onclick = App.logout));
  $('[data-pw]').onclick = App.changePassword;
  const viewEl = $('#view');

  function setActive(id) {
    $$('[data-r]').forEach((a) => a.classList.toggle('active', a.dataset.r === id));
    const a = $(`.nav a[data-r="${id}"]`);
    const pill = $('.nav .pill');
    if (a && pill) { pill.style.transform = `translateY(${a.offsetTop}px)`; pill.style.height = a.offsetHeight + 'px'; }
    const t = $(`.tabbar a[data-r="${id}"]`);
    if (t) t.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
  }

  async function route() {
    clearInterval(timer);
    const id = (location.hash.match(/^#\/([\w-]+)/) || [])[1] || 'panel';
    const r = ROUTES.find((x) => x.id === id) || ROUTES[0];
    setActive(r.id);
    document.title = r.label + ' · ' + BOOT.company;
    viewEl.innerHTML = '';
    const v = document.createElement('div');
    v.className = 'view';
    viewEl.appendChild(v);
    try { await r.view(v); } catch (e) { App.err(e); }
  }
  window.addEventListener('hashchange', route);
  window.addEventListener('resize', () => setActive((location.hash.match(/^#\/([\w-]+)/) || [])[1] || 'panel'));

  const head = (title, sub, tools) => `<div class="page-head"><div><h2>${h(title)}</h2>${sub ? `<p>${sub}</p>` : ''}</div><div class="toolbar">${tools || ''}</div></div>`;
  const emptyBox = (emoji, title, text, btn) => `<div class="empty"><div class="big">${emoji}</div><b>${h(title)}</b><span>${h(text || '')}</span>${btn || ''}</div>`;
  const skel = (n, hgt) => `<div class="grid">${`<div class="skeleton" style="height:${hgt || 56}px"></div>`.repeat(n || 4)}</div>`;
  const staffOptions = (users, sel, allLabel) => `<option value="">${h(allLabel || 'Ortak (tüm personel)')}</option>` +
    users.map((u) => `<option value="${u.id}" ${String(sel) === String(u.id) ? 'selected' : ''}>${h(u.name)}${u.role === 'admin' ? ' (yönetici)' : ''}</option>`).join('');
  const locOptions = (locs, sel, allLabel) => (allLabel !== undefined ? `<option value="">${h(allLabel)}</option>` : '') +
    locs.map((l) => `<option value="${l.id}" ${String(sel) === String(l.id) ? 'selected' : ''}>${h(l.name)}</option>`).join('');
  const taskDatalist = (tasks, id) => `<datalist id="${id}">${tasks.map((t) => `<option value="${h(t.name)}">`).join('')}</datalist>`;

  /* =========================================================
     Günlük durum paneli
     ========================================================= */
  async function viewDashboard(v) {
    let date = sessionStorage.getItem('istakip.dash') || App.today();
    if (date > App.today()) date = App.today();
    let filter = 'all';
    let q = '';
    let data = null;

    v.innerHTML = head('Günlük Durum', '', `
      <button class="btn icon" data-prev title="Önceki gün">${icon('chev', '')}</button>
      <input type="date" data-date value="${date}" max="${App.today()}">
      <button class="btn icon" data-next title="Sonraki gün">${icon('chev')}</button>
      <button class="btn" data-today>Bugün</button>
      <button class="btn icon" data-refresh title="Yenile">${icon('refresh')}</button>`) +
      `<div class="stats stagger" data-stats>${'<div class="skeleton" style="height:118px;border-radius:22px"></div>'.repeat(6)}</div>
      <div class="dash-grid"><div class="glass card" data-list>${skel(6)}</div><div class="grid" data-side></div></div>`;
    $('[data-prev] svg', v).style.transform = 'rotate(180deg)';
    const sub = $('.page-head p', v) || App.el('<p></p>');
    if (!$('.page-head p', v)) $('.page-head > div', v).appendChild(sub);

    const setDate = (d) => { if (d > App.today()) d = App.today(); date = d; sessionStorage.setItem('istakip.dash', d); $('[data-date]', v).value = d; load(); };
    $('[data-prev]', v).onclick = () => setDate(App.addDays(date, -1));
    $('[data-next]', v).onclick = () => setDate(App.addDays(date, 1));
    $('[data-today]', v).onclick = () => setDate(App.today());
    $('[data-date]', v).onchange = (e) => e.target.value && setDate(e.target.value);
    $('[data-refresh]', v).onclick = () => load();

    async function load() {
      try {
        data = await api('dashboard', null, { date });
        render();
      } catch (e) { App.err(e); }
    }

    function render() {
      const t = data.tally;
      const isToday = data.date === data.today;
      sub.innerHTML = `${h(App.fmtDate(data.date, true))}${isToday ? ` · saat ${h(data.now)}` : ''}${data.workday ? '' : ' · <b>iş günü değil</b>'}`;
      const stat = (key, lbl, n, c, ic) => `<div class="glass stat lift clickable" data-filter="${key}" style="--c:${c}">
        <div class="top"><span class="lbl">${lbl}</span><span class="icon">${icon(ic)}</span></div>
        <div class="num" data-n="${n}">0</div><span class="spark"></span></div>`;
      $('[data-stats]', v).innerHTML =
        stat('all', 'Toplam iş', t.total, '#6366f1', 'list') +
        stat('closed', 'Tamamlanan', t.done + t.issue, '#10b981', 'check') +
        stat('pending', 'Bekleyen', t.pending, '#64748b', 'clock') +
        stat('overdue', 'Geciken', t.overdue, '#f59e0b', 'alert') +
        stat('issue', 'Sorun bildirilen', t.issue, '#8b5cf6', 'flag') +
        stat('missed', 'Yapılmayan (7 gün)', data.missed_count, '#ef4444', 'x');
      $$('[data-n]', v).forEach((n) => App.countUp(n, +n.dataset.n));
      $$('[data-filter]', v).forEach((s) => (s.onclick = () => {
        if (s.dataset.filter === 'missed') { $('[data-missed]', v)?.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
        filter = s.dataset.filter; renderList(); $('[data-list]', v).scrollIntoView({ behavior: 'smooth', block: 'start' });
      }));
      renderList();
      renderSide();
    }

    function renderList() {
      const box = $('[data-list]', v);
      const f = (it) => filter === 'all' ? true : filter === 'closed' ? (it.status === 'done' || it.status === 'issue') : it.status === filter;
      const qq = q.toLocaleLowerCase('tr');
      const items = data.items.filter(f).filter((it) => !qq || (it.task + ' ' + it.location + ' ' + (it.user || '')).toLocaleLowerCase('tr').includes(qq));
      const chip = (k, l, n) => `<button class="chip ${filter === k ? 'active' : ''}" data-chip="${k}">${l}<span class="n">${n}</span></button>`;
      const t = data.tally;
      let html = `<div class="card-head"><h3>İş listesi</h3><input type="search" placeholder="Ara: iş, mekan, kişi" value="${h(q)}" data-q style="max-width:240px;min-height:38px"></div>
        <div class="chips" style="margin-bottom:8px">${chip('all', 'Tümü', t.total)}${chip('overdue', 'Geciken', t.overdue)}${chip('pending', 'Bekleyen', t.pending)}${chip('closed', 'Tamamlanan', t.done + t.issue)}${chip('issue', 'Sorunlu', t.issue)}${t.leave ? chip('leave', 'İzinli', t.leave) : ''}</div>`;
      if (!data.items.length) {
        html += emptyBox(data.workday ? '🗂️' : '🌴', data.workday ? 'Bu gün için planlanmış iş yok' : 'Bu gün iş günü değil',
          data.workday ? 'İş paketlerinden atama yaparak başlayın.' : 'Çalışma günlerini Ayarlar’dan değiştirebilirsiniz.',
          data.workday ? `<a class="btn primary" href="#/paketler">${icon('layers')}<span>Paketlerden ata</span></a>` : '');
      } else if (!items.length) {
        html += emptyBox('🔍', 'Bu filtrede iş yok', '');
      } else {
        const groups = new Map();
        items.forEach((it) => { if (!groups.has(it.location)) groups.set(it.location, []); groups.get(it.location).push(it); });
        html += '<div class="table-wrap"><table><thead><tr><th>İş</th><th>Sorumlu</th><th>Saat</th><th>Durum</th><th>Kim / ne zaman</th></tr></thead><tbody>';
        for (const [loc, list] of groups) {
          html += `<tr class="group"><td colspan="5">${icon('pin')} ${h(loc)} <span class="muted">· ${list.length}</span></td></tr>`;
          html += list.map((it) => `<tr data-key="${it.plan_id}|${it.occ_date}" style="cursor:pointer">
            <td><b>${h(it.task)}</b><div class="muted small">${h(it.freq)}${it.occ_date !== data.date ? ' · ' + h(App.fmtDate(it.occ_date)) + ' tarihli' : ''}</div></td>
            <td class="nowrap">${it.user ? h(it.user) : '<span class="muted">Ortak</span>'}</td>
            <td class="nowrap">${h(it.due_time || '—')}</td>
            <td>${App.badge(it.status)}${it.completion && it.completion.late ? ' <span class="badge overdue plain">geç</span>' : ''}</td>
            <td class="nowrap small">${it.completion ? `${h(it.completion.by || '')} · ${h(App.fmtTime(it.completion.at))}${it.completion.photo ? ' ' + icon('camera') : ''}${it.completion.note ? ' 💬' : ''}` : '<span class="muted">—</span>'}</td></tr>`).join('');
        }
        html += '</tbody></table></div>';
      }
      box.innerHTML = html;
      $$('[data-chip]', box).forEach((c) => (c.onclick = () => { filter = c.dataset.chip; renderList(); }));
      const qi = $('[data-q]', box);
      qi.oninput = () => { q = qi.value; const pos = qi.selectionStart; renderList(); const n = $('[data-q]', box); n.focus(); n.setSelectionRange(pos, pos); };
      $$('tr[data-key]', box).forEach((tr) => (tr.onclick = () => {
        const it = data.items.find((i) => i.plan_id + '|' + i.occ_date === tr.dataset.key);
        App.taskSheet(it, load);
      }));
    }

    function bars(list, emptyText) {
      if (!list.length) return `<p class="muted small">${h(emptyText)}</p>`;
      return '<div class="bars">' + list.map((g) => {
        const w = (n) => (g.total ? (n * 100) / g.total : 0).toFixed(1);
        return `<div class="bar-row" title="${g.done} yapıldı · ${g.issue} sorun · ${g.overdue} gecikmiş · ${g.pending} bekliyor${g.leave ? ' · ' + g.leave + ' izinli' : ''}">
          <div class="meta"><b>${h(g.name)}</b><span>${g.done + g.issue}/${g.total} · %${g.rate}</span></div>
          <div class="track-h"><i class="ok" data-w="${w(g.done)}"></i><i class="issue" data-w="${w(g.issue)}"></i><i class="warn" data-w="${w(g.overdue)}"></i><i class="bad" data-w="${w(g.missed)}"></i><i class="leave" data-w="${w(g.leave)}"></i></div></div>`;
      }).join('') + '</div>';
    }

    function renderSide() {
      const t = data.tally;
      const side = $('[data-side]', v);
      side.innerHTML = `
        <div class="glass card" style="display:flex;gap:18px;align-items:center" data-tilt="4">
          ${App.ring(t.rate, 120, undefined, 'tamamlandı')}
          <div class="grid" style="gap:6px"><h3>Genel ilerleme</h3>
            <p class="muted small">${t.done + t.issue} / ${t.total} iş kapandı</p>
            <div class="legend"><span><i style="background:var(--ok)"></i>Yapıldı</span><span><i style="background:var(--issue)"></i>Sorun</span><span><i style="background:var(--warn)"></i>Gecikti</span></div>
            <p class="muted small">${data.staff_count} aktif personel</p>
            ${data.on_leave.length ? `<div class="small"><span class="badge leave">İzinli</span> ${data.on_leave.map((u) => h(u.name)).join(', ')}</div>` : ''}</div></div>
        <div class="glass card"><div class="card-head"><h3>Mekanlara göre</h3></div>${bars(data.by_location, 'Veri yok')}</div>
        <div class="glass card"><div class="card-head"><h3>Personele göre</h3></div>${bars(data.by_user, 'Veri yok')}</div>
        <div class="glass card" data-missed><div class="card-head"><h3>Son 7 günde yapılmayanlar</h3><span class="badge missed">${data.missed_count}</span></div>
          ${data.missed.length ? '<div class="list">' + data.missed.slice(0, 30).map((m) => `<div class="row">
            <span class="dot" style="background:var(--bad)"></span>
            <div><div class="title">${h(m.task)}</div><div class="sub"><span>${h(m.location)}</span><span>${h(m.user || 'Ortak')}</span></div></div>
            <span class="small muted nowrap">${h(App.relDay(m.occ_date))}</span></div>`).join('') + '</div>' +
            (data.missed.length > 30 ? `<a class="btn sm block" href="#/raporlar" style="margin-top:10px">Tümünü raporda gör</a>` : '')
            : '<p class="muted small">Harika! Yapılmayan iş yok. ✨</p>'}</div>`;
      App.animateRings(side); App.animateBars(side);
    }

    await load();
    timer = setInterval(() => { if (date === App.today() && !document.hidden && !document.querySelector('.modal-back')) load(); }, 60000);
  }

  /* =========================================================
     İş atamaları
     ========================================================= */
  async function viewPlans(v) {
    v.innerHTML = head('İş Atamaları', 'Hangi işin, hangi mekanda, kim tarafından, ne sıklıkla yapılacağı', `
      <button class="btn" data-add>${icon('plus')}<span>Tek iş ekle</span></button>
      <button class="btn primary" data-apply>${icon('layers')}<span>Paketten ata</span></button>`) +
      `<div class="glass card" data-box>${skel(6)}</div>`;
    const [plans, locs, users] = await Promise.all([api('plans'), get('locations', true), get('users', true)]);
    let fLoc = sessionStorage.getItem('istakip.pl') || '';
    let fUser = sessionStorage.getItem('istakip.pu') || '';
    let q = '';
    const sel = new Set();
    $('[data-add]', v).onclick = () => planModal(null, () => route());
    $('[data-apply]', v).onclick = () => applyModal(null, () => route());

    function render() {
      const box = $('[data-box]', v);
      const qq = q.toLocaleLowerCase('tr');
      const list = plans.filter((p) => (!fLoc || String(p.location_id) === fLoc) &&
        (!fUser || (fUser === 'none' ? !p.user_id : String(p.user_id) === fUser)) &&
        (!qq || (p.task_name + ' ' + p.location_name).toLocaleLowerCase('tr').includes(qq)));
      let html = `<div class="toolbar" style="margin-bottom:12px">
        <select data-floc>${locOptions(locs, fLoc, 'Tüm mekanlar')}</select>
        <select data-fuser><option value="">Tüm personel</option><option value="none" ${fUser === 'none' ? 'selected' : ''}>Ortak işler</option>${users.map((u) => `<option value="${u.id}" ${fUser === String(u.id) ? 'selected' : ''}>${h(u.name)}</option>`).join('')}</select>
        <input type="search" placeholder="İş ara" data-q value="${h(q)}" style="max-width:220px">
        <span class="muted small">${list.length} atama</span>
        <span style="flex:1"></span>
        <span data-bulk ${sel.size ? '' : 'hidden'} class="toolbar"><b class="small">${sel.size} seçili</b>
          <button class="btn sm" data-reassign>${icon('swap')}<span>Devret</span></button>
          <button class="btn sm danger" data-bdel>${icon('trash')}<span>Kaldır</span></button></span></div>`;
      if (!plans.length) {
        html += emptyBox('🧭', 'Henüz iş ataması yok', 'Hazır bir iş paketini bir mekana ve personele atayarak hızlıca başlayabilirsiniz.',
          `<button class="btn primary" data-apply2>${icon('layers')}<span>Paketten ata</span></button>`);
      } else if (!list.length) {
        html += emptyBox('🔍', 'Filtreye uyan atama yok', '');
      } else {
        const groups = new Map();
        list.forEach((p) => { if (!groups.has(p.location_name)) groups.set(p.location_name, []); groups.get(p.location_name).push(p); });
        html += '<div class="table-wrap"><table><thead><tr><th style="width:30px"><label class="check"><input type="checkbox" data-all><span></span></label></th><th>İş</th><th>Sıklık</th><th>Saat</th><th>Sorumlu</th><th>Başlangıç</th><th></th></tr></thead><tbody>';
        for (const [loc, ps] of groups) {
          html += `<tr class="group"><td colspan="7">${icon('pin')} ${h(loc)} <span class="muted">· ${ps.length}</span></td></tr>`;
          html += ps.map((p) => `<tr>
            <td><label class="check"><input type="checkbox" data-sel="${p.id}" ${sel.has(p.id) ? 'checked' : ''}><span></span></label></td>
            <td><b>${h(p.task_name)}</b>${p.package_name ? `<div class="small" style="color:${h(p.package_color)}">● ${h(p.package_name)}</div>` : ''}${p.note ? `<div class="muted small">${h(p.note)}</div>` : ''}</td>
            <td class="nowrap">${h(p.freq)}</td><td>${h(p.due_time || '—')}</td>
            <td class="nowrap">${p.user_name ? App.avatar(p.user_name, 24) + ' ' + h(p.user_name) : '<span class="muted">Ortak</span>'}</td>
            <td class="nowrap small">${h(App.fmtDate(p.start_date))}${p.end_date ? ' → ' + h(App.fmtDate(p.end_date)) : ''}</td>
            <td class="nowrap"><button class="btn icon sm ghost" data-edit="${p.id}" title="Düzenle">${icon('edit')}</button>
              <button class="btn icon sm ghost danger" data-del="${p.id}" title="Kaldır">${icon('trash')}</button></td></tr>`).join('');
        }
        html += '</tbody></table></div>';
      }
      box.innerHTML = html;
      $('[data-floc]', box).onchange = (e) => { fLoc = e.target.value; sessionStorage.setItem('istakip.pl', fLoc); render(); };
      $('[data-fuser]', box).onchange = (e) => { fUser = e.target.value; sessionStorage.setItem('istakip.pu', fUser); render(); };
      const qi = $('[data-q]', box);
      qi.oninput = () => { q = qi.value; const pos = qi.selectionStart; render(); const n = $('[data-q]', box); n.focus(); n.setSelectionRange(pos, pos); };
      const a2 = $('[data-apply2]', box); if (a2) a2.onclick = () => applyModal(null, () => route());
      $$('[data-edit]', box).forEach((b) => (b.onclick = () => planModal(plans.find((p) => p.id == b.dataset.edit), () => route())));
      $$('[data-del]', box).forEach((b) => (b.onclick = async () => {
        if (!(await App.confirm('Bu atama bugünden itibaren kaldırılacak. Geçmiş kayıtlar raporlarda kalır.', { ok: 'Kaldır' }))) return;
        try { await api('plan_delete', { id: b.dataset.del }); App.toast('Atama kaldırıldı'); route(); } catch (e) { App.err(e); }
      }));
      $$('[data-sel]', box).forEach((c) => (c.onchange = () => { c.checked ? sel.add(+c.dataset.sel) : sel.delete(+c.dataset.sel); render(); }));
      const all = $('[data-all]', box);
      if (all) {
        all.checked = list.length && list.every((p) => sel.has(p.id));
        all.onchange = () => { list.forEach((p) => (all.checked ? sel.add(p.id) : sel.delete(p.id))); render(); };
      }
      const bd = $('[data-bdel]', box);
      if (bd) bd.onclick = async () => {
        if (!(await App.confirm(sel.size + ' atama bugünden itibaren kaldırılacak.', { ok: 'Kaldır' }))) return;
        try { await api('plan_delete', { ids: [...sel] }); App.toast(sel.size + ' atama kaldırıldı'); route(); } catch (e) { App.err(e); }
      };
      const ra = $('[data-reassign]', box);
      if (ra) ra.onclick = () => App.modal({
        title: 'Seçili işleri devret',
        body: `<label class="field"><span>Yeni sorumlu</span><select name="u">${staffOptions(users, '')}</select></label>`,
        actions: [{ label: 'Vazgeç', cls: 'ghost' }, { label: 'Devret', cls: 'primary', onClick: async (m) => {
          await api('plans_reassign', { ids: [...sel], user_id: $('select', m.body).value });
          App.toast(sel.size + ' iş devredildi'); route();
        } }],
      });
    }
    render();
  }

  async function planModal(p, done) {
    const [locs, users, tasks] = await Promise.all([get('locations', true), get('users'), get('tasks', true)]);
    if (!locs.length) { App.toast('Önce en az bir mekan ekleyin', 'bad'); location.hash = '#/mekanlar'; return; }
    p = p || {};
    App.modal({
      title: p.id ? 'Atamayı düzenle' : 'Yeni iş ataması',
      wide: true,
      body: `<form class="form"><datalist id="dl-tasks"></datalist>
        <label class="field"><span>İş</span><input name="task_name" list="dl-tasks" value="${h(p.task_name || '')}" placeholder="Listeden seçin ya da yeni bir iş yazın" required></label>
        <div class="grid2">
          <label class="field"><span>Mekan</span><select name="location_id">${locOptions(locs, p.location_id)}</select></label>
          <label class="field"><span>Sorumlu</span><select name="user_id">${staffOptions(users, p.user_id)}</select></label>
        </div>
        <fieldset><legend>Sıklık</legend>${App.freqFields(p, 'pf')}</fieldset>
        <div class="grid2">
          <label class="field"><span>Başlangıç</span><input type="date" name="start_date" value="${h((p.start_date || App.today()).slice(0, 10))}"></label>
          <label class="field"><span>Bitiş (isteğe bağlı)</span><input type="date" name="end_date" value="${h((p.end_date || '').slice(0, 10))}"></label>
        </div>
        <label class="field"><span>Personele not (isteğe bağlı)</span><input name="note" value="${h(p.note || '')}" placeholder="Örn. Çamaşır suyu depodaki mavi dolapta"></label>
        ${p.id ? '<p class="muted small">Not: Sıklık, mekan veya sorumlu değişirse geçmiş kayıtlar korunur; değişiklik bugünden itibaren geçerli olur.</p>' : ''}
      </form>`,
      onOpen: (m) => {
        App.bindFreq(m.body);
        const f = $('form', m.body);
        // Seçilen mekanda tanımlı işler önce önerilir; yeni atamada işin varsayılan sıklığı doldurulur.
        const fillList = () => {
          const loc = locs.find((l) => l.id == f.location_id.value);
          const ids = new Set(loc ? loc.task_ids : []);
          const own = tasks.filter((t) => ids.has(t.id));
          const rest = tasks.filter((t) => !ids.has(t.id));
          $('#dl-tasks', f).innerHTML = own.concat(rest).map((t) => `<option value="${h(t.name)}">${ids.has(t.id) ? 'Bu mekanın işi' : ''}</option>`).join('');
          hint();
        };
        const hint = () => {
          const loc = locs.find((l) => l.id == f.location_id.value);
          const t = tasks.find((x) => x.name.toLocaleLowerCase('tr') === f.task_name.value.trim().toLocaleLowerCase('tr'));
          let el = $('[data-hint]', f);
          if (!el) { el = App.el('<p class="muted small" data-hint></p>'); f.task_name.closest('.field').appendChild(el); }

  /* =========================================================
     Mekan ↔ iş ilişkisi: ortak seçim listesi
     ========================================================= */
  // items: [{id, name, sub?}], selected: id listesi
  function pickList(items, selected, name, emptyText) {
    const sel = new Set((selected || []).map(Number));
    if (!items.length) return `<p class="muted small">${h(emptyText || 'Liste boş.')}</p>`;
    return `<div class="pick" data-pick="${name}">
      <div class="pick-tools"><input type="search" placeholder="Ara" data-pq>
        <button type="button" class="btn sm ghost" data-pall>Tümünü seç</button><button type="button" class="btn sm ghost" data-pnone>Temizle</button>
        <span class="muted small" data-pcount></span></div>
      <div class="pick-items">${items.map((it) => `<label data-n="${h(it.name.toLocaleLowerCase('tr'))}"><input type="checkbox" name="${name}[]" value="${it.id}" ${sel.has(+it.id) ? 'checked' : ''}>
        <span>${h(it.name)}${it.sub ? `<small>${h(it.sub)}</small>` : ''}</span></label>`).join('')}</div></div>`;
  }
  function bindPick(root) {
    $$('[data-pick]', root).forEach((p) => {
      const boxes = () => $$('.pick-items input', p);
      const count = () => { const n = boxes().filter((b) => b.checked).length; $('[data-pcount]', p).textContent = n + ' seçili'; };
      $('[data-pq]', p).oninput = (e) => { const q = e.target.value.toLocaleLowerCase('tr'); $$('.pick-items label', p).forEach((l) => (l.hidden = !l.dataset.n.includes(q))); };
      $('[data-pall]', p).onclick = () => { boxes().forEach((b) => { if (!b.closest('label').hidden) b.checked = true; }); count(); };
      $('[data-pnone]', p).onclick = () => { boxes().forEach((b) => { if (!b.closest('label').hidden) b.checked = false; }); count(); };
      p.addEventListener('change', count); count();
    });
  }

        <div><div class="title">${h(l.name)}</div><div class="sub">${l.description ? `<span>${h(l.description)}</span>` : ''}<span>${names.length} tanımlı iş</span><span>${l.plan_count} aktif atama</span></div>
          <div class="loc-chips">${shown.map((n) => `<span class="lchip">${h(n)}</span>`).join('')}${names.length > 5 ? `<span class="lchip more">+${names.length - 5}</span>` : ''}${!names.length ? '<span class="lchip none">İş tanımlanmamış</span>' : ''}</div></div>
        <div class="actions">
          <button class="btn sm" data-assign="${l.id}" title="Bu mekanın işlerini personele ata">${icon('play')}<span>İşleri ata</span></button>
          <button class="btn icon sm ghost" data-up="${i}" ${i === 0 ? 'disabled' : ''} title="Yukarı"><svg class="ico" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
          <button class="btn icon sm ghost" data-down="${i}" ${i === locs.length - 1 ? 'disabled' : ''} title="Aşağı"><svg class="ico" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
          <button class="btn icon sm ghost" data-edit="${l.id}" title="Düzenle">${icon('edit')}</button>
          <button class="btn icon sm ghost danger" data-del="${l.id}" title="Sil">${icon('trash')}</button></div></div>`;
      }).join('') + '</div>';
      const move = async (i, d) => {
        const ids = locs.map((l) => l.id);
        [ids[i], ids[i + d]] = [ids[i + d], ids[i]];
        try { await api('locations_order', { ids }); invalidate('locations'); route(); } catch (e) { App.err(e); }
      };
      $$('[data-assign]', box).forEach((b) => (b.onclick = () => locationAssignModal(locs.find((l) => l.id == b.dataset.assign), route)));
      $$('[data-up]', box).forEach((b) => (b.onclick = () => move(+b.dataset.up, -1)));
      $$('[data-down]', box).forEach((b) => (b.onclick = () => move(+b.dataset.down, 1)));
      $$('[data-edit]', box).forEach((b) => (b.onclick = () => locationModal(locs.find((l) => l.id == b.dataset.edit), locs.length, route)));
      $$('[data-del]', box).forEach((b) => (b.onclick = async () => {
        if (!(await App.confirm('Mekan silinecek.', { ok: 'Sil' }))) return;
        try { await api('location_delete', { id: b.dataset.del }); invalidate('locations'); App.toast('Silindi'); route(); } catch (e) { App.err(e); }
      }));
    }

    function renderMatrix() {
      if (!locs.length || !tasks.length) { box.innerHTML = emptyBox('🧩', 'Tablo için mekan ve iş tanımı gerekli', ''); return; }
      const has = new Set();
      locs.forEach((l) => l.task_ids.forEach((t) => has.add(l.id + '|' + t)));
      const colCount = (l) => l.task_ids.length;
      const rowCount = (t) => locs.filter((l) => has.has(l.id + '|' + t.id)).length;
      box.innerHTML = `<div class="toolbar" style="margin-bottom:10px"><input type="search" placeholder="İş ara" data-q style="max-width:240px">
          <span class="muted small">Hücreye tıklayarak işin o mekanda yapılıp yapılmadığını belirleyin.</span></div>
        <div class="matrix-wrap"><table class="matrix"><thead><tr><th class="corner">İş \\ Mekan</th>
          ${locs.map((l) => `<th class="lh"><span>${h(l.name)}</span><small data-cc="${l.id}">${colCount(l)}</small></th>`).join('')}</tr></thead>
        <tbody>${tasks.map((t) => `<tr data-name="${h(t.name.toLocaleLowerCase('tr'))}"><th class="th"><b>${h(t.name)}</b><small>${h(t.freq)} · <span data-rc="${t.id}">${rowCount(t)}</span> mekan</small></th>
          ${locs.map((l) => `<td><button type="button" class="cell ${has.has(l.id + '|' + t.id) ? 'on' : ''}" data-l="${l.id}" data-t="${t.id}" title="${h(t.name)} · ${h(l.name)}" aria-pressed="${has.has(l.id + '|' + t.id)}">
            <svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button></td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
      $('[data-q]', box).oninput = (e) => { const q = e.target.value.toLocaleLowerCase('tr'); $$('tbody tr', box).forEach((r) => (r.hidden = !r.dataset.name.includes(q))); };
      box.querySelector('tbody').addEventListener('click', async (e) => {
        const c = e.target.closest('.cell');
        if (!c || c.disabled) return;
        const on = !c.classList.contains('on');
        const l = locs.find((x) => x.id == c.dataset.l);
        const tid = +c.dataset.t;
        c.classList.toggle('on', on); c.setAttribute('aria-pressed', on); c.disabled = true;
        try {
          await api('location_task_toggle', { location_id: l.id, task_id: tid, on: on ? 1 : 0 });
          if (on) l.task_ids.push(tid); else l.task_ids = l.task_ids.filter((x) => x !== tid);
          $(`[data-cc="${l.id}"]`, box).textContent = l.task_ids.length;
          $(`[data-rc="${tid}"]`, box).textContent = locs.filter((x) => x.task_ids.includes(tid)).length;
          invalidate('tasks', 'locations');
        } catch (err) { c.classList.toggle('on', !on); App.err(err); }
        c.disabled = false;
      });
    }

    function render() { if (mode === 'matrix') renderMatrix(); else renderList(); }
    render();
  }

  function leaveModal(u) {
    const t = App.today();
    const m = App.modal({
      title: u.name + ' — izin',
      body: `<form class="form">
        <div class="grid2"><label class="field"><span>Başlangıç</span><input type="date" name="date" value="${t}"></label>
        <label class="field"><span>Bitiş</span><input type="date" name="to" value="${t}"></label></div>
        <label class="field"><span>Açıklama (isteğe bağlı)</span><input name="note" placeholder="Örn. Yıllık izin, rapor"></label>
        <p class="muted small">İzinli günlerde bu kişiye atanmış işler “yapılmadı” yerine <b>İzinli</b> sayılır. Geçmiş tarihler için de girilebilir.</p>
        <div class="field"><span>Bugünden itibaren kayıtlı izinler</span><div data-list class="list"><div class="skeleton" style="height:40px"></div></div></div></form>`,
      actions: [{ label: 'Kapat', cls: 'ghost' }, { label: 'İzni kaydet', cls: 'primary', icon: 'check', onClick: async (mm) => {
        const f = $('form', mm.body);
        if (f.to.value < f.date.value) throw new Error('Bitiş tarihi başlangıçtan önce olamaz.');
        const r = await api('leave_set', { user_id: u.id, date: f.date.value, to: f.to.value, note: f.note.value });
        App.toast(`${r.count} gün izin kaydedildi`);
        route();
      } }],
    });
    const f = $('form', m.body);
    f.date.onchange = () => { if (f.to.value < f.date.value) f.to.value = f.date.value; };
    const list = $('[data-list]', m.body);
    const draw = async () => {
      const rows = await api('leaves', null, { user_id: u.id });
      list.innerHTML = rows.length ? rows.map((r) => `<div class="row"><span class="dot" style="background:var(--leave)"></span>
        <div><div class="title">${h(App.fmtDate(r.leave_date, true))}</div>${r.note ? `<div class="sub"><span>${h(r.note)}</span></div>` : ''}</div>
        <div class="actions"><button type="button" class="btn sm ghost danger" data-del="${r.leave_date}">Sil</button></div></div>`).join('')
        : '<p class="muted small">Kayıtlı izin yok.</p>';
      $$('[data-del]', list).forEach((b) => (b.onclick = async () => {
        try { await api('leave_delete', { user_id: u.id, date: b.dataset.del }); App.toast('İzin silindi', 'info'); draw(); } catch (e) { App.err(e); }
      }));
    };
    draw().catch(App.err);
  }

  async function viewReports(v) {
    const t = App.today();
    const d = App.parseDate(t);
    const monday = App.addDays(t, -((d.getDay() + 6) % 7));
    const monthStart = t.slice(0, 8) + '01';
    const prevMonthEnd = App.addDays(monthStart, -1);
    const prevMonthStart = prevMonthEnd.slice(0, 8) + '01';
    const ranges = { 'Bu hafta': [monday, t], 'Son 7 gün': [App.addDays(t, -6), t], 'Bu ay': [monthStart, t], 'Geçen ay': [prevMonthStart, prevMonthEnd], 'Son 30 gün': [App.addDays(t, -29), t] };
    let [from, to] = ranges['Son 7 gün'];
    let fUser = '', fLoc = '';
    const [locs, users] = await Promise.all([get('locations', true), get('users', true)]);

    v.innerHTML = head('Raporlar', 'Seçilen dönemde işlerin yapılma durumu', `
      <button class="btn" data-csv>${icon('download')}<span>Excel (CSV)</span></button>`) +
      `<div class="glass card" style="margin-bottom:16px"><div class="toolbar">
        <div class="chips" style="padding:0">${Object.keys(ranges).map((k) => `<button class="chip ${k === 'Son 7 gün' ? 'active' : ''}" data-range="${h(k)}">${h(k)}</button>`).join('')}</div>
        <input type="date" data-from value="${from}" max="${t}"> <span class="muted">→</span> <input type="date" data-to value="${to}" max="${t}">
        <select data-loc>${locOptions(locs, '', 'Tüm mekanlar')}</select>
        <select data-user><option value="">Tüm personel</option>${users.map((u) => `<option value="${u.id}">${h(u.name)}</option>`).join('')}</select>
      </div></div><div data-out>${skel(4, 120)}</div>`;

    const load = async () => {
      $('[data-out]', v).style.opacity = .5;
      try { render(await api('report', null, { from, to, user_id: fUser, location_id: fLoc })); } catch (e) { App.err(e); }
      $('[data-out]', v).style.opacity = 1;
    };
    $$('[data-range]', v).forEach((b) => (b.onclick = () => {
      [from, to] = ranges[b.dataset.range];
      $('[data-from]', v).value = from; $('[data-to]', v).value = to;
      $$('[data-range]', v).forEach((x) => x.classList.toggle('active', x === b)); load();
    }));
    $('[data-from]', v).onchange = (e) => { from = e.target.value; $$('[data-range]', v).forEach((x) => x.classList.remove('active')); load(); };
    $('[data-to]', v).onchange = (e) => { to = e.target.value; $$('[data-range]', v).forEach((x) => x.classList.remove('active')); load(); };
    $('[data-loc]', v).onchange = (e) => { fLoc = e.target.value; load(); };
    $('[data-user]', v).onchange = (e) => { fUser = e.target.value; load(); };
    $('[data-csv]', v).onclick = () => {
      App.download(`api.php?a=report_csv&from=${from}&to=${to}&user_id=${fUser}&location_id=${fLoc}`);
    };

    function table(list, title, col) {
      return `<div class="glass card"><div class="card-head"><h3>${h(title)}</h3></div><div class="table-wrap"><table>
        <thead><tr><th>${h(col)}</th><th>Toplam</th><th>Yapıldı</th><th>Sorun</th><th>Yapılmadı</th><th>İzinli</th><th>Oran</th></tr></thead><tbody>
        ${list.map((g) => `<tr><td><b>${h(g.name)}</b></td><td>${g.total}</td><td>${g.done}</td><td>${g.issue}</td><td>${g.missed ? `<b style="color:var(--bad)">${g.missed}</b>` : 0}</td><td>${g.leave || 0}</td>
          <td style="min-width:120px"><div class="track-h"><i class="ok" data-w="${g.rate}"></i></div><small class="muted">%${g.rate}</small></td></tr>`).join('')}
        </tbody></table></div></div>`;
    }

    function render(r) {
      const s = r.summary;
      const out = $('[data-out]', v);
      const max = Math.max(1, ...r.daily.map((d) => d.total));
      const stat = (lbl, n, c, ic) => `<div class="glass stat lift" style="--c:${c}"><div class="top"><span class="lbl">${lbl}</span><span class="icon">${icon(ic)}</span></div><div class="num" data-n="${n}">0</div><span class="spark"></span></div>`;
      out.innerHTML = `<div class="stats stagger">
          ${stat('Planlanan iş', s.total, '#6366f1', 'list')}${stat('Yapıldı', s.done, '#10b981', 'check')}
          ${stat('Sorun bildirildi', s.issue, '#8b5cf6', 'flag')}${stat('Yapılmadı', s.missed, '#ef4444', 'x')}
          ${stat('Geç yapıldı', s.late_done, '#f59e0b', 'clock')}
          <div class="glass stat lift" style="--c:#06b6d4;place-items:center">${App.ring(s.rate, 92, undefined, 'başarı')}</div></div>
        <div class="glass card" style="margin-bottom:16px"><div class="card-head"><h3>Günlük dağılım</h3>
          <div class="legend"><span><i style="background:var(--ok)"></i>Yapıldı</span><span><i style="background:var(--issue)"></i>Sorun</span><span><i style="background:var(--bad)"></i>Yapılmadı</span><span><i style="background:var(--leave)"></i>İzinli</span><span><i style="background:var(--line)"></i>Açık</span></div></div>
          <div class="colchart">${r.daily.map((d, i) => `<div class="col">
            <span class="tip">${h(App.fmtDate(d.date))}: ${d.done} yapıldı, ${d.issue} sorun, ${d.missed} yapılmadı${d.leave ? ', ' + d.leave + ' izinli' : ''}${d.open ? ', ' + d.open + ' açık' : ''}</span>
            ${['done:ok', 'issue:issue', 'missed:bad', 'leave:leave', 'open:open'].map((k) => { const [f, c] = k.split(':'); return d[f] ? `<i class="${c}" style="height:${(d[f] * 100) / max}%;animation-delay:${i * 0.02}s"></i>` : ''; }).join('')}</div>`).join('')}</div>
          <div class="axis">${r.daily.map((d, i) => `<span>${r.daily.length <= 16 || i % Math.ceil(r.daily.length / 12) === 0 ? h(App.fmtShort(d.date)) : ''}</span>`).join('')}</div></div>
        <div class="grid cols-2" style="margin-bottom:16px">${table(r.by_user, 'Personele göre', 'Personel')}${table(r.by_location, 'Mekanlara göre', 'Mekan')}</div>
        <div class="grid cols-2">${table(r.by_task.slice(0, 15), 'En çok aksayan işler', 'İş')}
          <div class="glass card"><div class="card-head"><h3>Aksayan kayıtlar</h3><span class="badge missed">${r.problem_count}</span></div>
          ${r.problems.length ? '<div class="list" style="max-height:520px;overflow:auto">' + r.problems.map((p) => `<div class="row">
            ${App.badge(p.status)}<div><div class="title">${h(p.task)}</div><div class="sub"><span>${h(p.location)}</span><span>${h(p.user || 'Ortak')}</span>
            ${p.completion && p.completion.note ? `<span>💬 ${h(p.completion.note)}</span>` : ''}</div></div>
            <span class="small muted nowrap">${h(App.fmtDate(p.occ_date))}</span></div>`).join('') + '</div>' : '<p class="muted small">Bu dönemde aksayan iş yok. 👏</p>'}</div></div>`;
      $$('[data-n]', out).forEach((n) => App.countUp(n, +n.dataset.n));
      App.animateRings(out); App.animateBars(out);
    }
    load();
  }

     Ayarlar

window.__runStaff = function () {
/* İş Takip — personel (mobil) ekranı */
(function () {
  'use strict';
  const { h, icon, $, $$ } = App;
  const me = BOOT.user;
  const root = document.getElementById('app');
  document.body.classList.add('role-staff');

  let data = null;
  let history = [];
  let day = null; // null = bugün
  let filter = 'todo';
  let celebrated = false;
  try { filter = localStorage.getItem('istakip.filter') || 'todo'; } catch (e) { /* yoksay */ }

  const ORDER = { overdue: 0, pending: 1, upcoming: 2, issue: 3, done: 4, missed: 5, leave: 6 };
  const isPast = () => data && data.date !== data.today;

  function shell() {
    root.innerHTML = `<div class="staff">
      <div class="s-top">${App.avatar(me.name)}
        <div class="who"><small>${h(App.greeting())},</small><b>${h(me.name)}</b></div>
        ${me.role === 'admin' ? `<a class="btn sm" href="index.php">${icon('home')}<span>Yönetim</span></a>` : ''}
        <button class="btn icon" data-refresh aria-label="Yenile">${icon('refresh')}</button>
        <button class="btn icon" data-menu aria-label="Menü">${icon('user')}</button>
      </div>
      <section class="glass hero" data-tilt="4"><div class="hero-ring"></div><div class="hero-text"></div></section>
      <div class="daystrip" role="tablist" aria-label="Son günler"></div>
      <div class="chips" role="tablist"></div>
      <div class="list-area"></div>
    </div>`;
    $('[data-refresh]', root).onclick = (e) => { const s = e.currentTarget.querySelector('svg'); s.animate([{ transform: 'rotate(0)' }, { transform: 'rotate(360deg)' }], { duration: 600, easing: 'cubic-bezier(.22,1,.36,1)' }); load(); };
    $('[data-menu]', root).onclick = () => {
      const m = App.modal({
        title: me.name,
        body: `<div class="grid"><p class="muted">Kullanıcı adı: <b>${h(me.username)}</b></p>
          <button class="btn block" data-leave>${icon('calendar')}<span>İzin bildir / izinlerim</span></button>
          <button class="btn block" data-pw>${icon('key')}<span>Şifre değiştir</span></button>
          <button class="btn block danger" data-out>${icon('logout')}<span>Çıkış yap</span></button>
          <p class="muted small">İpucu: Tarayıcı menüsünden “Ana ekrana ekle” diyerek uygulama gibi kullanabilirsiniz.</p></div>`,
      });
      $('[data-leave]', m.body).onclick = () => { m.close(); leaveModal(); };
      $('[data-pw]', m.body).onclick = () => { m.close(); App.changePassword(); };
      $('[data-out]', m.body).onclick = App.logout;
    };
  }

  function skeleton() {
    $('.list-area', root).innerHTML = '<div class="tasks">' + '<div class="skeleton" style="height:74px;border-radius:20px"></div>'.repeat(5) + '</div>';
  }

  async function load() {
    try {
      const [d, hist] = await Promise.all([App.api('my_day', null, { date: day }), App.api('my_history')]);
      data = d; history = hist;
      render();
    } catch (e) { App.err(e); }
  }

  function goDay(d) {
    day = !d || d === (data && data.today) ? null : d;

  /* ---------- izin ---------- */
  async function setLeave(date, to, note) {

  async function cancelLeave(date) {

  function quickLeave() {

      title: 'Bugün izinliyim',

        <label class="field"><span>Açıklama (isteğe bağlı)</span><input name="note" placeholder="Örn. Yıllık izin, rapor, mazeret"></label></form>`,
      actions: [{ label: 'Vazgeç', cls: 'ghost' }, { label: 'İzinli olarak işaretle', cls: 'primary', icon: 'calendar', onClick: async (m) => {
        await setLeave(data.today, data.today, $('input[name=note]', m.body).value);
      } }],

  }

  async function leaveModal() {
    const today = (data && data.today) || App.today();
    const m = App.modal({
      title: 'İzin bildir',
      body: `<form class="form">
        <div class="grid2"><label class="field"><span>Başlangıç</span><input type="date" name="date" min="${today}" value="${today}"></label>
        <label class="field"><span>Bitiş</span><input type="date" name="to" min="${today}" value="${today}"></label></div>
        <label class="field"><span>Açıklama (isteğe bağlı)</span><input name="note" placeholder="Örn. Yıllık izin"></label>
        <div class="field"><span>Kayıtlı izinlerim</span><div data-list class="list"><div class="skeleton" style="height:40px"></div></div></div></form>`,
      actions: [{ label: 'Kapat', cls: 'ghost' }, { label: 'İzni kaydet', cls: 'primary', icon: 'check', onClick: async (mm) => {
        const f = $('form', mm.body);
        if (f.to.value < f.date.value) throw new Error('Bitiş tarihi başlangıçtan önce olamaz.');
        await setLeave(f.date.value, f.to.value, f.note.value);
      } }],
    });
    const f = $('form', m.body);
    f.date.onchange = () => { if (f.to.value < f.date.value) f.to.value = f.date.value; };
    const list = $('[data-list]', m.body);
    const draw = async () => {
      try {
        const rows = await App.api('leaves');
        list.innerHTML = rows.length ? rows.map((r) => `<div class="row"><span class="dot" style="background:var(--leave)"></span>
          <div><div class="title">${h(App.fmtDate(r.leave_date, true))}</div>${r.note ? `<div class="sub"><span>${h(r.note)}</span></div>` : ''}</div>
          <div class="actions"><button type="button" class="btn sm ghost danger" data-del="${r.leave_date}">İptal</button></div></div>`).join('')
          : '<p class="muted small">Bugünden sonra kayıtlı izniniz yok.</p>';
        $$('[data-del]', list).forEach((b) => (b.onclick = async () => {
          try { await cancelLeave(b.dataset.del); draw(); } catch (e) { App.err(e); }
        }));
      } catch (e) { list.innerHTML = ''; App.err(e); }
    };
    draw();
  }

  /* ---------- çizim ---------- */
  function counts() {
    const t = data.tally;
    return { todo: t.pending + t.overdue, all: t.total, done: t.done + t.issue, open: t.pending + t.overdue + t.missed };
  }

  function renderHero() {
    const t = data.tally;
    const closed = t.done + t.issue;
    const past = isPast();
    $('.hero-ring', root).innerHTML = App.ring(t.rate, 104, undefined, 'tamam');
    let actions = '';
    if (past) actions = `<button class="btn sm" data-back>${icon('chev')}<span>Bugüne dön</span></button>`;
    if (data.on_leave && !past) actions += `<button class="btn sm ghost" data-unleave>İzni iptal et</button>`;
    if (!data.on_leave && !past && data.workday) actions += `<button class="btn sm" data-leave>${icon('calendar')}<span>Bugün izinliyim</span></button>`;
    $('.hero-text', root).innerHTML = `<h1>${past ? '' : 'Bugün · '}${h(App.fmtDate(data.date))}</h1>
      <p>${h(App.dayName(data.date))} · <b>${closed}</b> / ${t.total} iş tamamlandı</p>
      <div class="mini">${data.on_leave ? App.badge('leave', 'İzinli' + (data.leave_note ? ' · ' + data.leave_note : '')) : ''}
        ${t.overdue ? App.badge('overdue', t.overdue + ' gecikmiş') : ''}
        ${t.pending ? App.badge('pending', t.pending + ' bekliyor') : ''}
        ${t.missed ? App.badge('missed', t.missed + ' yapılmadı') : ''}
        ${t.issue ? App.badge('issue', t.issue + ' sorun') : ''}
        ${!data.on_leave && !t.overdue && !t.pending && !t.missed && t.total ? App.badge('done', 'Hepsi bitti') : ''}</div>
      ${actions ? `<div class="hero-actions">${actions}</div>` : ''}`;
    const back = $('[data-back]', root); if (back) { back.querySelector('svg').style.transform = 'rotate(180deg)'; back.onclick = () => goDay(null); }
    const lv = $('[data-leave]', root); if (lv) lv.onclick = quickLeave;
    const ul = $('[data-unleave]', root); if (ul) ul.onclick = async () => {
      if (await App.confirm('Bugünkü izin kaydınız silinecek ve işleriniz yeniden “bekliyor” olarak görünecek.', { ok: 'İzni iptal et', danger: false, title: 'İzni iptal et' })) {
        try { await cancelLeave(data.today); } catch (e) { App.err(e); }
      }
    };
    App.animateRings($('.hero', root));
  }

  function renderStrip() {
    const strip = $('.daystrip', root);
    strip.innerHTML = history.map((d) => {
      const t = d.tally;
      let cls = 'off', title = 'İş yok';
      if (d.on_leave) { cls = 'leave'; title = 'İzinli'; } else if (!d.workday && !t.total) { cls = 'off'; title = 'İş günü değil'; } else if (t.total) {
        const open = t.pending + t.overdue;
        cls = t.missed ? 'bad' : open ? (d.date === data.today ? 'live' : 'warn') : 'ok';
        title = `${t.done + t.issue}/${t.total} tamam${t.missed ? ', ' + t.missed + ' yapılmadı' : ''}`;
      }
      const isToday = d.date === data.today;
      return `<button class="day ${cls} ${d.date === data.date ? 'active' : ''}" data-day="${d.date}" title="${h(title)}" role="tab" aria-selected="${d.date === data.date}">
        <small>${isToday ? 'Bugün' : h(App.DAY_SHORT[((App.parseDate(d.date).getDay() + 6) % 7) + 1])}</small>
        <b>${App.parseDate(d.date).getDate()}</b>
        <i style="--p:${t.total - t.leave > 0 ? t.rate : 0}%"></i></button>`;
    }).join('');
    $$('[data-day]', strip).forEach((b) => (b.onclick = () => goDay(b.dataset.day)));
    const act = $('.day.active', strip);
    if (act) requestAnimationFrame(() => { strip.scrollLeft = act.offsetLeft - strip.clientWidth / 2 + act.clientWidth / 2; });
  }

  function chipDefs() {
    return isPast() ? [['all', 'Tümü'], ['done', 'Tamamlanan'], ['open', 'Yapılmayan']] : [['todo', 'Yapılacak'], ['all', 'Tümü'], ['done', 'Tamamlanan']];
  }
  function activeFilter() {
    const keys = chipDefs().map((c) => c[0]);
    return keys.includes(filter) ? filter : keys[0];
  }

  function renderChips() {
    const c = counts();
    const f = activeFilter();
    $('.chips', root).innerHTML = chipDefs().map(([k, l]) => `<button class="chip ${f === k ? 'active' : ''}" data-f="${k}">${l}<span class="n">${c[k]}</span></button>`).join('');
    $$('.chip', root).forEach((b) => (b.onclick = () => {
      filter = b.dataset.f;
      try { if (!isPast()) localStorage.setItem('istakip.filter', filter); } catch (e) { /* yoksay */ }
      renderChips(); renderList();
    }));
  }

  function visible(it) {
    const f = activeFilter();
    if (f === 'todo') return it.status === 'pending' || it.status === 'overdue' || (data.on_leave && it.status === 'leave');
    if (f === 'done') return it.status === 'done' || it.status === 'issue';
    if (f === 'open') return ['pending', 'overdue', 'missed'].includes(it.status);
    return true;
  }

  function taskCard(it) {
    const done = it.status === 'done' || it.status === 'issue';
    const carried = it.occ_date !== data.date;
    let sub = '';
    if (it.due_time) sub += `<span>${icon('clock')} ${h(it.due_time)}</span>`;
    sub += `<span>${h(it.freq)}</span>`;
    if (it.status === 'missed') sub += '<span class="miss">Yapılmadı</span>';
    else if (it.status === 'leave') sub += '<span class="lv">İzinli</span>';
    else if (carried && !done) sub += `<span class="late">${App.relDay(it.occ_date) === 'Dün' ? 'Dünden kalan' : 'Kalan iş · ' + h(App.fmtDate(it.occ_date))}</span>`;
    else if (it.status === 'overdue') sub += `<span class="late">${isPast() ? 'Hâlâ yapılabilir' : 'Saati geçti'}</span>`;
    if (done && it.completion) sub += `<span>${h(it.completion.by || '')} · ${h(App.fmtTime(it.completion.at))}${it.completion.late ? ' · geç' : ''}</span>`;
    if (!it.user_id) sub += '<span>Ortak</span>';
    const tickCls = it.status === 'done' ? 'on' : it.status === 'issue' ? 'issue' : it.status === 'overdue' ? 'overdue' : it.status === 'missed' ? 'missed' : '';
    return `<div class="task glass is-${it.status}" data-key="${it.plan_id}|${it.occ_date}" style="${it.color ? '--c:' + h(it.color) : ''}">
      <span class="stripe"></span>
      <button class="tick ${tickCls}" aria-label="${done ? 'Tamamlandı' : 'Tamamla'}"><svg viewBox="0 0 24 24">${it.status === 'issue' ? '<path d="M12 6v7M12 17.5v.5"/>' : it.status === 'missed' ? '<path d="M7 7l10 10M17 7L7 17"/>' : '<path d="M5 12.5l4.5 4.5L19 7.5"/>'}</svg><span class="burst"></span></button>
      <div class="t-body"><div class="t-title">${h(it.task)}</div><div class="t-sub">${sub}</div></div>
      <span class="chev">${icon('chev')}</span></div>`;
  }

  function renderList() {
    const area = $('.list-area', root);
    const items = data.items.filter(visible);
    const past = isPast();
    const leaveNote = data.on_leave && data.items.length
      ? `<div class="alert leave">${icon('calendar')}<span>${past ? 'Bu gün izinliydiniz' : 'Bugün izinli olarak işaretlisiniz'}. Yapılmayan işleriniz <b>yapılmadı</b> sayılmaz.</span></div>` : '';
    if (!data.items.length) {
      area.innerHTML = `<div class="glass empty"><div class="big">${data.on_leave ? '🏖️' : data.workday ? '☕' : '🌴'}</div>
        <b>${data.on_leave ? 'İzinli' : data.workday ? (past ? 'Bu gün size atanmış iş yoktu' : 'Bugün size atanmış iş yok') : (past ? 'İş günü değildi' : 'Bugün iş günü değil')}</b>
        <span>${past ? '' : 'İyi dinlenmeler!'}</span></div>`;
      return;
    }
    if (!items.length) {
      const allDone = activeFilter() === 'todo' || (past && activeFilter() === 'open');
      area.innerHTML = leaveNote + `<div class="glass done-banner"><div class="big">${allDone ? '🎉' : '🗒️'}</div>
        <b>${allDone ? (past ? 'Bu günün tüm işleri tamamlanmış.' : 'Tebrikler! Bugünkü tüm işler tamam.') : 'Burada bir şey yok.'}</b>
        <span class="muted">${allDone && !past ? 'Emeğiniz için teşekkürler.' : ''}</span></div>`;
      return;
    }
    const groups = new Map();
    items.sort((a, b) => (ORDER[a.status] - ORDER[b.status]) || String(a.due_time || '99').localeCompare(String(b.due_time || '99')) || a.task.localeCompare(b.task, 'tr'));
    items.forEach((it) => { if (!groups.has(it.location)) groups.set(it.location, []); groups.get(it.location).push(it); });
    let html = leaveNote;
    let gi = 0;
    for (const [loc, list] of groups) {
      const all = data.items.filter((i) => i.location === loc);
      const closed = all.filter((i) => i.status === 'done' || i.status === 'issue').length;
      html += `<section class="loc-group" style="animation-delay:${gi++ * 0.05}s"><div class="loc-head">${icon('pin')}<h3>${h(loc)}</h3><span class="cnt">${closed}/${all.length}</span></div>
        <div class="tasks stagger">${list.map(taskCard).join('')}</div></section>`;
    }
    area.innerHTML = html;
  }

  function render() {
    renderHero(); renderStrip(); renderChips(); renderList();
    const t = data.tally;
    if (!isPast() && !data.on_leave && t.total && t.pending + t.overdue === 0 && !celebrated) {
      celebrated = true;
      setTimeout(() => App.confetti(innerWidth / 2, innerHeight / 3, 60), 300);
    }
  }

  function findItem(key) { return data.items.find((i) => i.plan_id + '|' + i.occ_date === key); }

  function recalc() {
    const t = { total: 0, done: 0, issue: 0, pending: 0, overdue: 0, missed: 0, upcoming: 0, leave: 0 };
    data.items.forEach((i) => { t.total++; t[i.status]++; });
    const base = t.total - t.leave;
    t.rate = base > 0 ? Math.round(((t.done + t.issue) * 100) / base) : (t.total ? 100 : 0);
    data.tally = t;
  }

  async function quickToggle(card, it) {
    const tick = card.querySelector('.tick');
    if (it.status === 'missed') { App.taskSheet(it, load); return; }
    if (it.completion) {
      if (!App.canUndo(it)) { App.taskSheet(it, load); return; }
      if (!(await App.confirm('Bu işin tamamlandı işaretini geri almak istiyor musunuz?', { ok: 'Geri al', title: it.task }))) return;
      try { await App.uncompleteItem(it); App.toast('İşaret geri alındı', 'info'); load(); } catch (e) { App.err(e); }
      return;
    }
    // İyimser güncelleme: önce animasyon, sonra sunucu.
    const prev = { status: it.status };
    tick.classList.add('on');
    card.classList.add('is-done', 'just-done');
    const r = tick.getBoundingClientRect();
    App.confetti(r.left + r.width / 2, r.top + r.height / 2, 18);
    if (navigator.vibrate) navigator.vibrate(12);
    try {
      const res = await App.completeItem(it, 'done');
      Object.assign(it, res);
      recalc();
      renderHero(); renderChips();
      setTimeout(() => { renderList(); if (data.tally.pending + data.tally.overdue === 0) render(); }, activeFilter() === 'todo' ? 550 : 0);
      App.api('my_history').then((hh) => { history = hh; renderStrip(); }).catch(() => {});
      App.toast('Tamamlandı: ' + it.task, '', {
        action: 'Geri al',
        onAction: async () => { try { await App.uncompleteItem(it); celebrated = false; load(); } catch (e) { App.err(e); } },
      });
    } catch (e) {
      it.status = prev.status;
      tick.classList.remove('on'); card.classList.remove('is-done', 'just-done');
      App.err(e);
      if (/zaten/.test(e.message)) load();
    }
  }

  root.addEventListener('click', (e) => {
    const card = e.target.closest('.task');
    if (!card) return;
    const it = findItem(card.dataset.key);
    if (!it) return;
    if (e.target.closest('.tick')) quickToggle(card, it);
    else App.taskSheet(it, () => { celebrated = false; load(); });
  });

  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
  setInterval(() => { if (!document.hidden && !document.querySelector('.modal-back')) load(); }, 120000);

  shell(); skeleton(); load();
})();

};

  App.logout = function () { App.toast('Demoda çıkış yok. Görünümü üstteki çubuktan değiştirebilirsiniz.', 'info'); };
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href^="index.php"]');
    if (!a) return;
    e.preventDefault();
    DEMO.switchTo(a.getAttribute('href').indexOf('view=staff') >= 0 ? 'staff' : 'admin');
  }, true);
  document.getElementById('demo-' + DEMO.mode).checked = true;
  document.querySelectorAll('input[name=demo-mode]').forEach(function (r) {
    r.addEventListener('change', function () { DEMO.switchTo(r.value); });
  });
  document.getElementById('demo-reset').onclick = function () {
    App.confirm('Tüm değişiklikler silinip örnek veriler yeniden yüklenecek.', { ok: 'Sıfırla', title: 'Demoyu sıfırla' }).then(function (ok) { if (ok) DEMO.reset(); });
  };
  document.body.classList.add(DEMO.mode === 'admin' ? 'role-admin' : 'role-staff');
  if (DEMO.mode === 'admin') window.__runAdmin(); else window.__runStaff();
})();
</script>
